<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Log Aktivitas | Astro Inventory</title>

    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <!-- LUCIDE ICON -->
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="../../styles/global.css" />

    <style>
      /* =========================================
         ASTRO INVENTORY - LOG AKTIVITAS
         UKURAN KONSISTEN DENGAN HALAMAN LAIN
      ========================================= */

      html,
      body,
      #app,
      #app * {
        font-family: "Inter", Arial, sans-serif !important;
      }

      #content {
        width: 100%;
        min-width: 0;
        font-family: "Inter", Arial, sans-serif;
        font-size: 12px !important;
        line-height: 1.5;
        color: #172033;
      }

      #content *,
      #content *::before,
      #content *::after {
        box-sizing: border-box;
      }

      /* PAGE WRAPPER */

      #content .log-page {
        width: 100%;
        min-width: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* TYPOGRAPHY */

      #content h1 {
        margin: 0;
        font-size: 22px !important;
        line-height: 1.35 !important;
        font-weight: 700;
        letter-spacing: -0.35px;
      }

      #content h2 {
        font-size: 14px !important;
        line-height: 1.45;
        font-weight: 700;
      }

      #content h3 {
        font-size: 14px !important;
        line-height: 1.45;
        font-weight: 700;
      }

      #content p {
        line-height: 1.5;
      }

      #content .text-3xl {
        font-size: 30px !important;
        line-height: 1.3 !important;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      #content .text-xl {
        font-size: 22px !important;
      }

      #content .text-lg {
        font-size: 17px !important;
      }

      #content .text-sm {
        font-size: 12px !important;
      }

      #content .text-xs {
        font-size: 11px !important;
      }

      #content .text-\[9px\] {
        font-size: 9px !important;
      }

      #content .text-\[10px\] {
        font-size: 10px !important;
      }

      #content .text-\[11px\] {
        font-size: 11px !important;
      }

      /* CARD */

      #content .log-card {
        min-width: 0;
        padding: 14px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      }

      #content .log-card.p-0 {
        padding: 0 !important;
      }

      #content .log-stat {
        min-height: 112px;
      }

      #content .log-stat-value {
        margin-top: 7px;
        font-size: 30px !important;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.5px;
      }

      #content .log-stat-value span {
        font-size: 12px !important;
        font-weight: 400;
        letter-spacing: 0;
      }

      /* ICON */

      #content svg,
      #sidebar svg,
      .astro-topbar svg {
        display: inline-block;
        flex-shrink: 0;
        vertical-align: middle;
        visibility: visible;
        opacity: 1;
      }

      #content i[data-lucide] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
      }

      #content .log-icon-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border-radius: 10px;
      }

      #content .log-icon-box svg {
        width: 17px;
        height: 17px;
      }

      /* BUTTON */

      #content button,
      #content .log-button {
        font-family: "Inter", Arial, sans-serif;
        font-size: 12px !important;
        font-weight: 600;
        line-height: 1.4;
        cursor: pointer;
        transition: all 0.18s ease;
      }

      #content .log-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid #dbe4f0;
        border-radius: 9px;
        background: #fff;
        color: #183153;
        white-space: nowrap;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.035);
      }

      #content .log-button:hover {
        color: #1d4ed8;
        border-color: #93b4f5;
        background: #f5f8ff;
      }

      #content .log-button.primary {
        color: #fff;
        border-color: #1d4ed8;
        background: #1d4ed8;
        box-shadow: 0 2px 5px rgba(29, 78, 216, 0.18);
      }

      #content .log-button.primary:hover {
        color: #fff;
        border-color: #1e40af;
        background: #1e40af;
      }

      #content .log-button svg {
        width: 15px;
        height: 15px;
      }

      #content button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* INPUT DAN DROPDOWN */

      #content input,
      #content select {
        font-family: "Inter", Arial, sans-serif !important;
        font-size: 12px !important;
      }

      #content input:focus,
      #content select:focus {
        outline: none;
        border-color: #93b4f5;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
      }

      #content .log-filter-control {
        width: 100%;
        min-width: 0;
        min-height: 38px;
        height: 38px;
        padding: 8px 12px;
        border: 1px solid #dbe4f0;
        border-radius: 9px;
        background: #f8fafc;
        color: #334155;
        line-height: 1.4;
      }

      #content input.log-filter-control::placeholder {
        color: #94a3b8;
      }

      #content select.log-filter-control {
        padding: 6px 28px 6px 10px;
        background-color: #fff;
      }

      #content .log-verification-input {
        width: 100%;
        min-width: 0;
        min-height: 38px;
        height: 38px;
        padding: 9px 11px;
        border: 1px solid #dbe4f0;
        border-radius: 9px;
        background: #f8fafc;
        color: #334155;
      }

      /* BADGE */

      #content .log-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        max-width: 100%;
        padding: 5px 9px;
        border: 1px solid transparent;
        border-radius: 6px;
        font-size: 10px !important;
        font-weight: 600;
        line-height: 1.35;
        white-space: nowrap;
      }

      /* TABLE */

      #content .log-table-wrapper {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: thin;
        scrollbar-color: #94a3b8 #f1f5f9;
      }

      #content .log-table-wrapper::-webkit-scrollbar {
        height: 8px;
      }

      #content .log-table-wrapper::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 10px;
      }

      #content .log-table-wrapper::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
      }

      #content .log-table {
        width: 100%;
        min-width: 1220px;
        border-collapse: collapse;
        border-spacing: 0;
        table-layout: auto;
        font-size: 12px;
        line-height: 1.5;
      }

      #content .log-table thead {
        background: #f8fafc;
      }

      #content .log-table thead th {
        padding: 13px 9px;
        background: #f8fafc;
        color: #475569;
        border-bottom: 1px solid #e2e8f0;
        font-size: 11px !important;
        font-weight: 700;
        line-height: 1.4;
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
      }

      #content .log-table tbody td {
        padding: 12px 9px;
        color: #334155;
        border-bottom: 1px solid #edf1f6;
        font-size: 12px !important;
        line-height: 1.5;
        vertical-align: middle;
      }

      #content .log-table tbody tr {
        background: #fff;
        transition: background 0.15s ease;
      }

      #content .log-table tbody tr:hover {
        background: #f8fafc;
      }

      #content .log-table tbody tr:last-child td {
        border-bottom: none;
      }

      #content .log-code {
        color: #1d4ed8;
        font-size: 12px !important;
        font-weight: 700;
        white-space: nowrap;
      }

      #content .log-hash {
        display: inline-block;
        max-width: 130px;
        overflow: hidden;
        color: #94a3b8;
        font-family: monospace !important;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #content .log-risk {
        color: #dc2626;
      }

      #content .log-mono {
        font-family: monospace !important;
        overflow-wrap: anywhere;
      }

      /* TABLE FOOTER */

      #content .log-footer {
        padding: 12px;
        border-top: 1px solid #e2e8f0;
        background: #fff;
      }

      #content .log-footer button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 30px;
        min-height: 30px;
        padding: 5px 9px;
        border: 1px solid #dbe4f0;
        border-radius: 7px;
        background: #fff;
        color: #475569;
        font-size: 11px !important;
        font-weight: 600;
      }

      #content .log-footer button:hover:not(:disabled) {
        color: #1d4ed8;
        border-color: #93b4f5;
        background: #f5f8ff;
      }

      #content .log-footer button.active {
        color: #fff;
        border-color: #1d4ed8;
        background: #1d4ed8;
      }

      #content .log-footer button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      /* VERIFICATION */

      #content .log-verification-result {
        min-height: 74px;
        padding: 12px;
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
        font-family: monospace !important;
        font-size: 11px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      /* ACCESSIBILITY */

      #content button:focus-visible,
      #content input:focus-visible,
      #content select:focus-visible {
        outline: 3px solid rgba(59, 130, 246, 0.2);
        outline-offset: 2px;
      }

      /* RESPONSIVE */

      @media (max-width: 1024px) {
        #content .log-card {
          padding: 12px;
        }

        #content .log-card.p-0 {
          padding: 0 !important;
        }

        #content .log-stat-value {
          font-size: 26px !important;
        }
      }

      @media (max-width: 768px) {
        #content .log-page {
          gap: 14px;
        }

        #content h1 {
          font-size: 19px !important;
        }

        #content h2,
        #content h3 {
          font-size: 13px !important;
        }

        #content .log-stat-value {
          font-size: 25px !important;
        }

        #content .log-table thead th {
          padding: 11px 8px;
          font-size: 10px !important;
        }

        #content .log-table tbody td {
          padding: 10px 8px;
          font-size: 11px !important;
        }

        #content .log-button {
          min-height: 34px;
          padding: 7px 10px;
          font-size: 11px !important;
        }

        #content .log-filter-control {
          min-height: 36px;
          height: 36px;
          font-size: 11px !important;
        }
      }

      @media (max-width: 480px) {
        #content .log-card {
          padding: 11px;
          border-radius: 10px;
        }

        #content .log-card.p-0 {
          padding: 0 !important;
        }

        #content .log-stat-value {
          font-size: 22px !important;
        }

        #content .log-footer {
          padding: 10px;
        }
      }
    </style>
  </head>

  <body data-active="log-aktivitas" class="bg-slate-50 text-slate-800">

        <!-- FILTER LOG -->

            <input
              id="searchLog"
              type="search"
              class="log-filter-control"
              placeholder="Cari ID Log, Hash SHA-256, User / NIP..."
              aria-label="Cari log aktivitas"
            />

            <select
              id="filterModul"

            <button type="button" id="resetLogFilter" class="log-button">

    <!-- MAIN LAYOUT SCRIPT -->
    <script src="../../layouts/main-layout.js"></script>

    <!-- PAGE SCRIPT -->
    <script>
      /* =========================================
         UTILITIES
      ========================================= */

      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, (character) => {
          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          };

          return entities[character];
        });
      }

      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons({
            attrs: {
              "stroke-width": 1.8,
            },
          });
        }

        if (typeof window.refreshLucideIcons === "function") {
          window.refreshLucideIcons();
        }
      }

      /* =========================================
         SIDEBAR PATH UNTUK FOLDER AUDIT
      ========================================= */

      function setupAuditSidebar() {
        const activePage = document.body.dataset.active;

        const auditMenus = [
          "log-aktivitas",
          "temuan-audit",
          "tindak-lanjut",
          "laporan-audit",
        ];

        document
          .querySelectorAll(".sidebar-navigation [data-nav]")
          .forEach((link) => {
            const menu = link.dataset.nav;

            if (auditMenus.includes(menu)) {
              link.href = "./" + menu + ".html";
            } else {
              link.href = "../" + menu + ".html";
            }

            const isActive = menu === activePage;

            link.classList.toggle("active", isActive);
            link.classList.toggle("nav-active", isActive);

            if (isActive) {
              link.setAttribute("aria-current", "page");
            } else {
              link.removeAttribute("aria-current");
            }
          });
      }

      /* =========================================
         LOAD MAIN LAYOUT
      ========================================= */

      async function loadMainLayout() {
        const app = document.getElementById("app");

        if (!app) {
          console.error("Elemen #app tidak ditemukan.");
          return;
        }

        try {
          const response = await fetch("../../layouts/MainLayout.html");

          if (!response.ok) {
            throw new Error(
              "MainLayout.html gagal dimuat. Status: " + response.status,
            );
          }

          const html = await response.text();

          app.innerHTML = html;

          const content = document.getElementById("content");
          const template = document.getElementById("page");

          if (!content) {
            throw new Error(
              "Elemen #content tidak ditemukan di MainLayout.html.",
            );
          }

          if (!template) {
            throw new Error("Template halaman #page tidak ditemukan.");
          }

          /* MASUKKAN KONTEN KE MAIN LAYOUT */
          content.appendChild(template.content.cloneNode(true));

          /* SET LINK DAN MENU AKTIF */
          setupAuditSidebar();

          /* INITIALIZE MAIN LAYOUT */
          if (typeof window.initMainLayout === "function") {
            window.initMainLayout();
          }

          /* INITIALIZE PAGE */
          initLogAktivitas();

          /* REFRESH ICON */
          refreshIcons();
        } catch (error) {
          console.error("Gagal memuat halaman:", error);

          app.innerHTML = `
            <div class="w-full min-h-screen flex items-center justify-center p-6">
              <div class="max-w-md w-full bg-white border border-red-200 rounded-xl p-6 text-center">
                <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-red-50 text-red-600 flex items-center justify-center">
                  <i data-lucide="alert-circle"></i>
                </div>

                <h2 class="text-lg font-bold text-slate-900">
                  Gagal Memuat Halaman
                </h2>

                <p class="text-sm text-slate-500 mt-2">
                  ${escapeHTML(error.message)}
                </p>

                <button
                  type="button"
                  onclick="location.reload()"
                  class="mt-4 px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold"
                >
                  Muat Ulang
                </button>
              </div>
            </div>
          `;

          refreshIcons();
        }
      }

      /* =========================================
         LOG AKTIVITAS
      ========================================= */

      function initLogAktivitas() {
        const searchInput = document.getElementById("searchLog");
        const filterModul = document.getElementById("filterModul");
        const filterRisiko = document.getElementById("filterRisiko");
        const filterWaktu = document.getElementById("filterWaktu");
        const filterRisikoTinggi =
          document.getElementById("filterRisikoTinggi");

        const resetButton = document.getElementById("resetLogFilter");
        const table = document.getElementById("logTable");
        const totalLabel = document.getElementById("logTotal");

        const hashInput = document.getElementById("hashInput");
        const verifyButton = document.getElementById("verifyHash");
        const resultBox = document.getElementById("verificationResult");

        const verifyLedgerButton = document.getElementById("verifyLedger");

        const exportButton = document.getElementById("exportLog");

        if (
          !searchInput ||
          !filterModul ||
          !filterRisiko ||
          !filterWaktu ||
          !filterRisikoTinggi ||
          !resetButton ||
          !table ||
          !totalLabel
        ) {
          console.error("Elemen halaman Log Aktivitas tidak lengkap.");
          return;
        }

        const rows = Array.from(table.querySelectorAll("tr"));

        /* =========================================
           FILTER DATA LOG
        ========================================= */

        function filterLogs() {
          const keyword = searchInput.value.trim().toLocaleLowerCase("id");

          const moduleValue = filterModul.value;
          const riskValue = filterRisiko.value;
          const dateValue = filterWaktu.value;
          const highRiskOnly = filterRisikoTinggi.checked;

          let visible = 0;

          rows.forEach((row) => {
            const text = row.innerText.toLocaleLowerCase("id");

            const matchSearch = !keyword || text.includes(keyword);

            const matchModule =
              !moduleValue || row.dataset.module === moduleValue;

            const matchRisk = !riskValue || row.dataset.risk === riskValue;

            const matchDate = !dateValue || row.dataset.date === dateValue;

            const matchHighRisk =
              !highRiskOnly || row.dataset.highRisk === "true";

            const show =
              matchSearch &&
              matchModule &&
              matchRisk &&
              matchDate &&
              matchHighRisk;

            row.style.display = show ? "" : "none";

            if (show) visible++;
          });

          totalLabel.textContent =
            "Menampilkan " +
            visible +
            " dari " +
            rows.length +
            " data log pada halaman ini";
        }

        /* =========================================
           EVENT FILTER
        ========================================= */

        searchInput.addEventListener("input", filterLogs);
        filterModul.addEventListener("change", filterLogs);
        filterRisiko.addEventListener("change", filterLogs);
        filterWaktu.addEventListener("change", filterLogs);
        filterRisikoTinggi.addEventListener("change", filterLogs);

        /* =========================================
           RESET FILTER
        ========================================= */

        resetButton.addEventListener("click", () => {
          searchInput.value = "";
          filterModul.value = "";
          filterRisiko.value = "";
          filterWaktu.value = "";
          filterRisikoTinggi.checked = false;

          filterLogs();
        });

        /* =========================================
           AKSI TABEL
        ========================================= */

        table.addEventListener("click", (event) => {
          const button = event.target.closest("[data-log-action]");

          if (!button) return;

          const row = button.closest("tr");

          if (!row) return;

          const eventId =
            row.querySelector(".log-code")?.textContent.trim() || "-";

          const action = button.dataset.logAction;

          const messages = {
            payload:
              "Detail payload untuk " +
              eventId +
              "\n\nData payload ditampilkan sebagai simulasi antarmuka.",

            investigasi:
              "Event " +
              eventId +
              "\n\nStatus: Memerlukan investigasi lebih lanjut.",

            detail:
              "Detail log " + eventId + "\n\nInformasi rekonsiliasi ledger.",

            bap: "Berita Acara Pemeriksaan untuk " + eventId,

            sesi: "Detail sesi keamanan untuk " + eventId,
          };

          alert(messages[action] || "Detail aktivitas " + eventId);
        });

        /* =========================================
           VERIFIKASI HASH
        ========================================= */

        function verifyHash() {
          if (!hashInput || !resultBox) return;

          const hash = hashInput.value.trim();

          if (!hash) {
            resultBox.innerHTML =
              '<span class="text-amber-400">⚠ Masukkan hash terlebih dahulu.</span>';

            hashInput.focus();
            return;
          }

          const isValidFormat = /^[a-fA-F0-9]{64}$/.test(hash);

          if (!isValidFormat) {
            resultBox.innerHTML =
              '<span class="text-red-400">✕ Format hash tidak valid.</span>' +
              "<br>Hash SHA-256 harus terdiri dari 64 karakter hexadecimal.";

            return;
          }

          resultBox.innerHTML =
            '<span class="text-blue-400">✓ Format hash SHA-256 valid.</span>' +
            "<br>Hash: " +
            escapeHTML(hash) +
            "<br><br>" +
            '<span class="text-amber-400">Status: Simulasi validasi lokal.</span>' +
            "<br>Verifikasi kriptografis aktual memerlukan data ledger dan backend.";
        }

        verifyButton?.addEventListener("click", verifyHash);

        hashInput?.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            verifyHash();
          }
        });

        /* =========================================
           TOMBOL VERIFIKASI LEDGER
        ========================================= */

        verifyLedgerButton?.addEventListener("click", () => {
          hashInput?.focus();

          resultBox?.scrollIntoView({
            behavior: "smooth",
            block: "center",
          });
        });

        /* =========================================
           EKSPOR CSV
        ========================================= */

        exportButton?.addEventListener("click", () => {
          const visibleRows = rows.filter(
            (row) => row.style.display !== "none",
          );

          const headers = [
            "Timestamp",
            "ID Event",
            "Hash",
            "Aktor",
            "Modul",
            "Deskripsi",
            "Risiko",
          ];

          const csvRows = visibleRows.map((row) => {
            const cells = row.querySelectorAll("td");

            const timestamp = cells[0]?.innerText || "";

            const eventId =
              cells[1]?.querySelector(".log-code")?.innerText || "";

            const hash = cells[1]?.querySelector(".log-hash")?.innerText || "";

            const actor = cells[2]?.innerText || "";
            const module = cells[3]?.innerText || "";
            const description = cells[4]?.innerText || "";
            const risk = cells[5]?.innerText || "";

            return [timestamp, eventId, hash, actor, module, description, risk];
          });

          const escapeCSV = (value) =>
            '"' + String(value).replace(/"/g, '""') + '"';

          const csvContent = [headers, ...csvRows]
            .map((row) => row.map(escapeCSV).join(","))
            .join("\n");

          const blob = new Blob(["\uFEFF" + csvContent], {
            type: "text/csv;charset=utf-8;",
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");

          link.href = url;
          link.download = "log-aktivitas-astro-inventory.csv";

          document.body.appendChild(link);
          link.click();
          link.remove();

          URL.revokeObjectURL(url);
        });

        /* =========================================
           FILTER AWAL
        ========================================= */

        filterLogs();
      }

      /* =========================================
         JALANKAN HALAMAN
      ========================================= */

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadMainLayout, {
          once: true,
        });
      } else {
        loadMainLayout();
      }
    </script>
  </body>
