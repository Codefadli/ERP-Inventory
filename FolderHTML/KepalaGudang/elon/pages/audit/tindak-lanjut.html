<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Tindak Lanjut Temuan | Astro Inventory</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <link rel="stylesheet" href="../../styles/global.css" />

    <style>
      /* =========================================
         TINDAK LANJUT TEMUAN - ASTRO INVENTORY
      ========================================= */

      #content .followup-page {
        width: 100%;
        min-width: 0;
        padding: 0;
        color: #334155;
        font-family: "Inter", Arial, sans-serif;
        font-size: 12px;
        line-height: 1.5;
      }

      #content .followup-page *,
      #content .followup-page *::before,
      #content .followup-page *::after {
        box-sizing: border-box;
      }

      #content .followup-page .page-breadcrumb {
        margin-bottom: 16px;
        color: #64748b;
        font-size: 10px;
      }

      #content .followup-page .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 20px;
        margin-bottom: 16px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }

      #content .followup-page .page-title {
        margin: 0;
        color: #0f172a;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: -0.35px;
      }

      #content .followup-page .page-description {
        max-width: 720px;
        margin-top: 6px;
        color: #64748b;
        font-size: 12px;
        line-height: 1.6;
      }

      #content .followup-page .header-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      #content .followup-page .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid #dbe4f0;
        border-radius: 9px;
        background: #fff;
        color: #183153;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        cursor: pointer;
        transition: 0.2s ease;
      }

      #content .followup-page .btn:hover {
        background: #f8fafc;
        border-color: #cbd5e1;
      }

      #content .followup-page .btn-primary {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #fff;
      }

      #content .followup-page .btn-primary:hover {
        background: #1e40af;
        border-color: #1e40af;
      }

      #content .followup-page .btn-success {
        background: #15803d;
        border-color: #15803d;
        color: #fff;
      }

      #content .followup-page .btn-success:hover {
        background: #166534;
        border-color: #166534;
      }

      #content .followup-page .btn-danger {
        background: #fff;
        border-color: #fecaca;
        color: #b91c1c;
      }

      #content .followup-page .btn svg {
        width: 15px;
        height: 15px;
      }

      #content .followup-page .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 16px;
      }

      #content .followup-page .stat-card {
        min-width: 0;
        padding: 16px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }

      #content .followup-page .stat-label {
        color: #64748b;
        font-size: 11px;
        font-weight: 500;
      }

      #content .followup-page .stat-value {
        margin-top: 8px;
        color: #0f172a;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.7px;
      }

      #content .followup-page .stat-value small {
        color: #64748b;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0;
      }

      #content .followup-page .stat-note {
        margin-top: 6px;
        color: #64748b;
        font-size: 10px;
      }

      #content .followup-page .filter-panel {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 12px;
        margin-bottom: 16px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }

      #content .followup-page .filter-control {
        flex: 1;
        min-width: 160px;
        min-height: 36px;
        padding: 7px 10px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        outline: none;
        background: #f8fafc;
        color: #475569;
        font-family: inherit;
        font-size: 11px;
      }

      #content .followup-page .filter-control:focus {
        border-color: #93c5fd;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
      }

      #content .followup-page .urgent-filter {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 5px;
        color: #475569;
        font-size: 11px;
        white-space: nowrap;
        cursor: pointer;
      }

      #content .followup-page .urgent-filter input,
      #content .followup-page .compliance-check input {
        width: 14px;
        height: 14px;
        accent-color: #1d4ed8;
        cursor: pointer;
      }

      #content .followup-page .panel {
        min-width: 0;
        margin-bottom: 16px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }

      #content .followup-page .table-scroll {
        width: 100%;
        overflow-x: auto;
      }

      #content .followup-page .followup-table {
        width: 100%;
        min-width: 1220px;
        border-collapse: collapse;
        text-align: left;
      }

      #content .followup-page .followup-table thead {
        background: #f8fafc;
      }

      #content .followup-page .followup-table th {
        padding: 13px 10px;
        border-bottom: 1px solid #e2e8f0;
        color: #475569;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      #content .followup-page .followup-table td {
        padding: 13px 10px;
        border-bottom: 1px solid #f1f5f9;
        color: #475569;
        font-size: 11px;
        line-height: 1.6;
        vertical-align: top;
      }

      #content .followup-page .followup-table tbody tr:last-child td {
        border-bottom: 0;
      }

      #content .followup-page .followup-table tbody tr:hover {
        background: #fafcff;
      }

      #content .followup-page .finding-id {
        display: inline-block;
        margin-bottom: 4px;
        color: #1d4ed8;
        font-weight: 700;
        white-space: nowrap;
      }

      #content .followup-page .person-name {
        color: #1e293b;
        font-weight: 700;
      }

      #content .followup-page .risk-badge,
      #content .followup-page .status-badge {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        max-width: 100%;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 600;
        line-height: 1.4;
        white-space: nowrap;
      }

      #content .followup-page .risk-high {
        background: #fee2e2;
        color: #b91c1c;
      }

      #content .followup-page .risk-medium {
        background: #fef3c7;
        color: #92400e;
      }

      #content .followup-page .risk-low {
        background: #f1f5f9;
        color: #475569;
      }

      #content .followup-page .status-waiting {
        background: #dbeafe;
        color: #1e40af;
      }

      #content .followup-page .status-progress {
        background: #e0e7ff;
        color: #3730a3;
      }

      #content .followup-page .status-complete {
        background: #dcfce7;
        color: #15803d;
      }

      #content .followup-page .due-danger {
        color: #dc2626;
        font-weight: 600;
      }

      #content .followup-page .due-normal {
        color: #64748b;
      }

      #content .followup-page .table-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      #content .followup-page .table-actions .btn {
        min-height: 30px;
        padding: 6px 9px;
        font-size: 10px;
      }

      #content .followup-page .table-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        background: #f8fafc;
        border-top: 1px solid #e2e8f0;
        color: #64748b;
        font-size: 10px;
      }

      #content .followup-page .pagination {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      #content .followup-page .pagination span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        height: 28px;
        padding: 0 8px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        background: #fff;
        color: #475569;
      }

      #content .followup-page .pagination .current {
        border-color: #1d4ed8;
        background: #1d4ed8;
        color: #fff;
      }

      #content .followup-page .bottom-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      #content .followup-page .content-card {
        min-width: 0;
        padding: 18px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }

      #content .followup-page .card-title {
        margin: 0;
        color: #0f172a;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }

      #content .followup-page .card-description {
        margin-top: 5px;
        color: #64748b;
        font-size: 11px;
        line-height: 1.6;
      }

      #content .followup-page .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 14px;
      }

      #content .followup-page .form-label {
        display: block;
        margin-bottom: 5px;
        color: #64748b;
        font-size: 10px;
        font-weight: 600;
      }

      #content .followup-page .form-static {
        min-height: 36px;
        padding: 9px 10px;
        border: 1px solid #e2e8f0;
        border-radius: 7px;
        background: #f8fafc;
        color: #334155;
        font-size: 11px;
        line-height: 1.5;
      }

      #content .followup-page .evaluation-input {
        display: block;
        width: 100%;
        min-height: 90px;
        padding: 10px;
        margin-top: 12px;
        resize: vertical;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: #334155;
        font-family: inherit;
        font-size: 11px;
      }

      #content .followup-page .evaluation-input:focus {
        border-color: #93c5fd;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
      }

      #content .followup-page .compliance-box {
        padding: 12px;
        margin-top: 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
      }

      #content .followup-page .compliance-title {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 11px;
        font-weight: 700;
      }

      #content .followup-page .compliance-check {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 7px;
        color: #475569;
        font-size: 10px;
        line-height: 1.5;
        cursor: pointer;
      }

      #content .followup-page .signoff-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 14px;
      }

      #content .followup-page .hash-status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #15803d;
        font-size: 10px;
        font-weight: 600;
      }

      #content .followup-page .hash-status svg {
        width: 14px;
        height: 14px;
      }

      #content .followup-page .area-progress {
        margin-top: 15px;
      }

      #content .followup-page .progress-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: #334155;
        font-size: 11px;
        font-weight: 700;
      }

      #content .followup-page .progress-track {
        height: 7px;
        margin-top: 7px;
        overflow: hidden;
        border-radius: 20px;
        background: #e2e8f0;
      }

      #content .followup-page .progress-fill {
        height: 100%;
        border-radius: 20px;
      }

      #content .followup-page .progress-note {
        margin-top: 5px;
        color: #64748b;
        font-size: 10px;
      }

      #content .followup-page .trend-note {
        padding: 10px;
        margin-top: 16px;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        background: #eff6ff;
        color: #1e40af;
        font-size: 10px;
        line-height: 1.6;
      }

      #content .followup-page .empty-state {
        display: none;
        padding: 28px 16px;
        color: #64748b;
        text-align: center;
        font-size: 11px;
      }

      #content .followup-page .notice {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 9999;
        display: none;
        max-width: 360px;
        padding: 12px 16px;
        border: 1px solid #bfdbfe;
        border-radius: 9px;
        background: #fff;
        color: #1e40af;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 8px 25px rgba(15, 23, 42, 0.12);
      }

      @media (max-width: 1100px) {
        #content .followup-page .stats-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 768px) {
        #content .followup-page .page-header {
          flex-direction: column;
          padding: 16px;
        }

        #content .followup-page .page-title {
          font-size: 19px;
        }

        #content .followup-page .header-actions {
          width: 100%;
        }

        #content .followup-page .header-actions .btn {
          flex: 1;
        }

        #content .followup-page .stat-value {
          font-size: 25px;
        }

        #content .followup-page .bottom-grid {
          grid-template-columns: 1fr;
        }

        #content .followup-page .filter-control {
          min-width: 100%;
        }

        #content .followup-page .filter-panel {
          align-items: stretch;
        }

        #content .followup-page .urgent-filter {
          width: 100%;
        }

        #content .followup-page .signoff-footer {
          align-items: flex-start;
          flex-direction: column;
        }

        #content .followup-page .signoff-footer .btn {
          width: 100%;
        }
      }

      @media (max-width: 480px) {
        #content .followup-page .stats-grid {
          grid-template-columns: 1fr 1fr;
          gap: 9px;
        }

        #content .followup-page .stat-card {
          padding: 12px;
        }

        #content .followup-page .stat-label {
          min-height: 30px;
          font-size: 10px;
        }

        #content .followup-page .stat-value {
          font-size: 23px;
        }

        #content .followup-page .header-actions {
          flex-direction: column;
        }

        #content .followup-page .header-actions .btn {
          width: 100%;
        }

        #content .followup-page .form-grid {
          grid-template-columns: 1fr;
        }

        #content .followup-page .content-card {
          padding: 14px;
        }

        #content .followup-page .table-footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body data-active="tindak-lanjut" class="bg-slate-50 text-slate-800">
    <div id="app"></div>

    <!-- =========================================
         PAGE CONTENT
    ========================================== -->
    <template id="page">
      <main class="followup-page">
        <!-- BREADCRUMB -->
        <div class="page-breadcrumb">
          Kepatuhan &amp; Audit &gt; Investigasi &amp; Kepatuhan &gt;
          <span class="font-semibold text-blue-700">
            Tindak Lanjut Temuan
          </span>
        </div>

        <!-- PAGE HEADER -->
        <section class="page-header">
          <div>
            <h1 class="page-title">
              Tindak Lanjut Temuan &amp; Monitoring CAPA
            </h1>

            <p class="page-description">
              Monitoring status implementasi tindakan korektif dan preventif
              (CAPA), evaluasi respon auditee, verifikasi bukti perbaikan, dan
              pengesahan penutupan temuan audit.
            </p>
          </div>

          <div class="header-actions">
            <button type="button" class="btn" id="export-matrix">
              <i data-lucide="download"></i>
              Unduh Matriks (XLS/PDF)
            </button>

            <button type="button" class="btn btn-primary" id="create-capa">
              <i data-lucide="plus"></i>
              Buat Rencana CAPA Baru
            </button>
          </div>
        </section>

        <!-- STATISTICS -->
        <section class="stats-grid">
          <div class="stat-card">
            <p class="stat-label">Tingkat Penyelesaian CAPA</p>

            <p class="stat-value">71,4%</p>

            <p class="stat-note">10 / 14 selesai · target triwulan Q4: 85,0%</p>
          </div>

          <div class="stat-card">
            <p class="stat-label">Menunggu Verifikasi</p>

            <p class="stat-value">3 <small>Kasus</small></p>

            <p class="stat-note">Butuh tinjau lapangan</p>
          </div>

          <div class="stat-card">
            <p class="stat-label">Jatuh Tempo (&lt; 48 Jam)</p>

            <p class="stat-value text-red-600">2 <small>Rekomendasi</small></p>

            <p class="stat-note">Eskalasi Head of Ops</p>
          </div>

          <div class="stat-card">
            <p class="stat-label">Rata-rata Durasi Close-Out</p>

            <p class="stat-value">3,2 <small>Hari</small></p>

            <p class="stat-note">Target SOP &lt; 5,0 hari</p>
          </div>
        </section>

        <!-- FILTER PANEL -->
        <section class="filter-panel">
          <select id="status-filter" class="filter-control">
            <option value="">Semua Status Tindak Lanjut</option>
            <option value="waiting">Menunggu Verifikasi Auditor</option>
            <option value="progress">Dalam Implementasi</option>
            <option value="complete">Verifikasi Selesai</option>
          </select>

          <select id="unit-filter" class="filter-control">
            <option value="">Semua Unit / Lokasi</option>
            <option value="cakung">Hub Cakung DC-01 (Utama)</option>
            <option value="inbound">Inbound</option>
            <option value="outbound">Outbound</option>
            <option value="mutasi">Mutasi Armada</option>
          </select>

          <select id="due-filter" class="filter-control">
            <option value="">Semua Batas Waktu</option>
            <option value="urgent">Batas Waktu Terdekat</option>
            <option value="normal">Jadwal Normal</option>
          </select>

          <label class="urgent-filter">
            <input type="checkbox" id="urgent-only" checked />
            Aksi mendesak hari ini
          </label>
        </section>

        <!-- FOLLOW-UP TABLE -->
        <section class="panel">
          <div class="table-scroll">
            <table class="followup-table">
              <thead>
                <tr>
                  <th>No. LTA &amp; Temuan</th>
                  <th>PIC Auditee &amp; Unit</th>
                  <th>Rencana CAPA (Korektif &amp; Preventif)</th>
                  <th>Bukti Perbaikan</th>
                  <th>Target Selesai</th>
                  <th>Status Kemajuan</th>
                  <th>Aksi Auditor</th>
                </tr>
              </thead>

              <tbody id="followup-table-body">
                <!-- DATA 1 -->
                <tr
                  data-status="waiting"
                  data-unit="cakung"
                  data-due="urgent"
                  data-urgent="true"
                >
                  <td>
                    <span class="finding-id">#LTA-2025-041</span>

                    <br />

                    <span class="risk-badge risk-high">Tinggi</span>

                    <p class="mt-2">Defisit -3 unit Sandisk SSD 1TB</p>
                  </td>

                  <td>
                    <span class="person-name">Budi Santoso</span>
                    <br />
                    Kepala Gudang &amp; Tim Keamanan
                  </td>

                  <td>
                    Pengetatan akses lorong Rak C-02, pemasangan gembok sensor
                    biometrik ganda, dan penerbitan Berita Acara Selisih Fisik
                    (write-off kargo).
                  </td>

                  <td>
                    <div class="flex items-center gap-1">
                      <i
                        data-lucide="file-pdf"
                        class="w-3.5 h-3.5 text-red-500"
                      ></i>
                      BAP_Selisih.pdf
                    </div>

                    <div class="flex items-center gap-1 mt-1">
                      <i
                        data-lucide="image"
                        class="w-3.5 h-3.5 text-blue-500"
                      ></i>
                      Foto_CCTV_Lock.jpg
                    </div>
                  </td>

                  <td>
                    <strong>19 Okt 2025</strong>
                    <br />
                    <span class="due-danger">Sisa 18 Jam</span>
                  </td>

                  <td>
                    <span class="status-badge status-waiting">
                      Menunggu Verifikasi
                    </span>

                    <p class="mt-2">85% implementasi</p>

                    <div class="progress-track mt-2">
                      <div
                        class="progress-fill bg-blue-600"
                        style="width: 85%"
                      ></div>
                    </div>
                  </td>

                  <td>
                    <div class="table-actions">
                      <button
                        type="button"
                        class="btn"
                        data-action="Verifikasi"
                        data-case="LTA-2025-041"
                      >
                        Verifikasi
                      </button>

                      <button
                        type="button"
                        class="btn btn-primary"
                        data-action="Setujui"
                        data-case="LTA-2025-041"
                      >
                        Setujui
                      </button>
                    </div>
                  </td>
                </tr>

                <!-- DATA 2 -->
                <tr
                  data-status="progress"
                  data-unit="inbound"
                  data-due="normal"
                  data-urgent="false"
                >
                  <td>
                    <span class="finding-id">#LTA-2025-039</span>

    <!-- =========================================
         LOAD MAIN LAYOUT
    ========================================== -->
    <script src="../../layouts/main-layout.js"></script>

    <script>
      /* =========================================
         ASTRO INVENTORY - TINDAK LANJUT TEMUAN
      ========================================= */

      document.addEventListener("DOMContentLoaded", async function () {
        const app = document.getElementById("app");
        const pageTemplate = document.getElementById("page");

        try {
          const response = await fetch("../../layouts/MainLayout.html");

          if (!response.ok) {
            throw new Error(
              "MainLayout.html tidak ditemukan: " + response.status,
            );
          }

          const layoutHTML = await response.text();

          app.innerHTML = layoutHTML;

          const content = document.getElementById("content");

          if (!content) {
            throw new Error(
              "Elemen #content tidak ditemukan di MainLayout.html",
            );
          }

          /* MASUKKAN KONTEN HALAMAN */
          content.innerHTML = pageTemplate.innerHTML;

          /* =========================================
             SIDEBAR NAVIGATION
          ========================================= */

          const auditMenus = [
            "log-aktivitas",
            "temuan-audit",
            "tindak-lanjut",
            "laporan-audit",
          ];

          document
            .querySelectorAll(".sidebar-navigation [data-nav]")
            .forEach((link) => {
              const menu = link.dataset.nav;

              if (auditMenus.includes(menu)) {
                link.href = "./" + menu + ".html";
              } else {
                link.href = "../" + menu + ".html";
              }

              const isActive = menu === document.body.dataset.active;

              link.classList.toggle("active", isActive);
              link.classList.toggle("nav-active", isActive);
            });

          /* INISIALISASI MAIN LAYOUT */
          if (typeof window.initMainLayout === "function") {
            window.initMainLayout();
          }

          /* INISIALISASI ICON */
          refreshFollowupIcons();

          /* INISIALISASI FITUR HALAMAN */
          initFollowupPage();
        } catch (error) {
          console.error("Gagal memuat Tindak Lanjut Temuan:", error);

          app.innerHTML = `
            <div style="
              margin: 24px;
              padding: 20px;
              border: 1px solid #fecaca;
              border-radius: 10px;
              background: #fff;
              color: #b91c1c;
              font-family: "Inter", Arial, sans-serif;
              font-size: 13px;
            ">
              <strong>Gagal memuat halaman Tindak Lanjut Temuan.</strong>
              <p style="margin-top: 8px; color: #64748b;">
                ${escapeFollowupHTML(error.message)}
              </p>
            </div>
          `;
        }
      });

      /* =========================================
         REFRESH LUCIDE ICONS
      ========================================= */

      function refreshFollowupIcons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }

        if (typeof window.refreshLucideIcons === "function") {
          window.refreshLucideIcons();
        }
      }

      /* =========================================
         HTML ESCAPE
      ========================================= */

      function escapeFollowupHTML(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          };

          return entities[char];
        });
      }

      /* =========================================
         PAGE INITIALIZATION
      ========================================= */

      function initFollowupPage() {
        initFollowupFilters();
        initFollowupActions();
        initFollowupExport();
      }

      /* =========================================
         NOTIFICATION
      ========================================= */

      function showFollowupNotice(message) {
        const notice = document.getElementById("followup-notice");

        if (!notice) return;

        notice.textContent = message;
        notice.style.display = "block";

        clearTimeout(window.followupNoticeTimeout);

        window.followupNoticeTimeout = setTimeout(() => {
          notice.style.display = "none";
        }, 3500);
      }

      /* =========================================
         TABLE FILTERS
      ========================================= */

      function initFollowupFilters() {
        const statusFilter = document.getElementById("status-filter");
        const unitFilter = document.getElementById("unit-filter");
        const dueFilter = document.getElementById("due-filter");
        const urgentOnly = document.getElementById("urgent-only");

        if (!statusFilter || !unitFilter || !dueFilter || !urgentOnly) {
          return;
        }

        function filterRows() {
          const rows = Array.from(
            document.querySelectorAll("#followup-table-body tr"),
          );

          let visibleCount = 0;

          rows.forEach((row) => {
            const matchStatus =
              !statusFilter.value || row.dataset.status === statusFilter.value;

            const matchUnit =
              !unitFilter.value ||
              row.dataset.unit === unitFilter.value ||
              (unitFilter.value === "cakung" && row.dataset.unit === "mutasi");

            const matchDue =
              !dueFilter.value || row.dataset.due === dueFilter.value;

            const matchUrgent =
              !urgentOnly.checked || row.dataset.urgent === "true";

            const visible = matchStatus && matchUnit && matchDue && matchUrgent;

            row.style.display = visible ? "" : "none";

            if (visible) visibleCount++;
          });

          const emptyState = document.getElementById("empty-state");
          const tableInfo = document.getElementById("table-info");

          if (emptyState) {
            emptyState.style.display = visibleCount === 0 ? "block" : "none";
          }

          if (tableInfo) {
            tableInfo.textContent =
              "Menampilkan " +
              visibleCount +
              " dari " +
              rows.length +
              " entri pada halaman ini · total 14 rekomendasi CAPA";
          }
        }

        statusFilter.addEventListener("change", filterRows);
        unitFilter.addEventListener("change", filterRows);
        dueFilter.addEventListener("change", filterRows);
        urgentOnly.addEventListener("change", filterRows);

        /* Kondisi awal mengikuti checkbox mendesak */
        filterRows();
      }

      /* =========================================
         TABLE ACTIONS & SIGN OFF
      ========================================= */

      function initFollowupActions() {
        document
          .querySelectorAll("[data-action][data-case]")
          .forEach((button) => {
            button.addEventListener("click", function () {
              const action = this.dataset.action;
              const caseId = this.dataset.case;

              showFollowupNotice(
                action +
                  " untuk " +
                  caseId +
                  ". Hubungkan tindakan ini dengan modul audit untuk memproses data.",
              );
            });
          });

        const createCapaButton = document.getElementById("create-capa");

        if (createCapaButton) {
          createCapaButton.addEventListener("click", function () {
            showFollowupNotice(
              "Form rencana CAPA baru siap diintegrasikan dengan modul data temuan audit.",
            );
          });
        }

        const signoffButton = document.getElementById("signoff-button");

        if (signoffButton) {
          signoffButton.addEventListener("click", function () {
            const notes = document.getElementById("evaluation-notes");

            const checks = Array.from(
              document.querySelectorAll(
                ".compliance-check input[type='checkbox']",
              ),
            );

            const allChecked = checks.every((checkbox) => checkbox.checked);

            if (!allChecked) {
              showFollowupNotice(
                "Lengkapi seluruh pemeriksaan kepatuhan sebelum pengesahan.",
              );
              return;
            }

            if (!notes.value.trim()) {
              showFollowupNotice(
                "Tuliskan evaluasi auditor sebelum menutup kasus.",
              );
              notes.focus();
              return;
            }

            showFollowupNotice(
              "Validasi formulir berhasil. Proses tanda tangan digital memerlukan integrasi sistem autentikasi dan sertifikat elektronik.",
            );
          });
        }
      }

      /* =========================================
         EXPORT TABLE TO CSV
      ========================================= */

      function initFollowupExport() {
        const exportButton = document.getElementById("export-matrix");

        if (!exportButton) return;

        exportButton.addEventListener("click", function () {
          const table = document.querySelector(".followup-table");

          if (!table) return;

          const rows = Array.from(table.querySelectorAll("tr"));

          const csvContent = rows
            .map((row) => {
              const cells = Array.from(row.querySelectorAll("th, td"));

              return cells
                .map((cell) => {
                  let value = cell.innerText.replace(/\s+/g, " ").trim();

                  value = value.replace(/"/g, '""');

                  return '"' + value + '"';
                })
                .join(",");
            })
            .join("\n");

          const blob = new Blob(["\uFEFF" + csvContent], {
            type: "text/csv;charset=utf-8;",
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");

          link.href = url;
          link.download = "matriks-tindak-lanjut-capa.csv";

          document.body.appendChild(link);
          link.click();
          link.remove();

          URL.revokeObjectURL(url);

          showFollowupNotice("Matriks tindak lanjut berhasil diekspor ke CSV.");
        });
      }
    </script>
