<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mutasi Barang | Astro Inventory</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body data-active="mutasi-barang" class="bg-slate-50 text-slate-900">
    <div id="app" class="flex min-h-screen"></div>
    <template id="page">
      <div>
        <p class="text-[11px] text-slate-500">
          OPERASIONAL &amp; TRANSAKSI &gt; MUTASI BARANG (INTERNAL &amp;
          ANTAR-HUB)
        </p>
        <div class="flex flex-wrap items-start justify-between gap-3 mt-1">
          <div>
            <h1 class="text-2xl font-bold">
              Mutasi Barang (Stock Transfer &amp; Relokasi)
            </h1>
            <p class="text-sm text-slate-600 max-w-2xl">
              Pengelolaan perpindahan stok internal antar-rak, antar-zona
              gudang, serta transfer mutasi antar-hub operasional DC secara
              presisi dan tercatat real-time.
            </p>
          </div>
          <div class="flex gap-2">
            <button class="btn">Ekspor Riwayat Mutasi</button
            ><button class="btn">Jadwal Shuttle Antar-Hub</button
            ><button class="btn btn-primary">+ Buat Mutasi Barang Baru</button>
          </div>
        </div>
      </div>
      <section class="grid grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="card">
          <p class="text-xs text-slate-500">Total Mutasi Hari Ini</p>
          <p class="text-3xl font-bold mt-1">428 Unit</p>
          <p class="text-xs text-green-700 mt-1">
            18 mutasi selesai dipindahkan
          </p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Transfer Sedang Berjalan</p>
          <p class="text-3xl font-bold mt-1">9 Berkas MT</p>
          <p class="text-xs text-slate-500 mt-1">
            5 antar-hub · 4 intra-gudang
          </p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Akurasi Bin-to-Bin Scan</p>
          <p class="text-3xl font-bold mt-1">99,9%</p>
          <p class="text-xs text-green-700 mt-1">
            Barcode asal &amp; tujuan 100% match
          </p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Menunggu Konfirmasi Penerima</p>
          <p class="text-3xl font-bold mt-1">3 Berkas</p>
          <p class="text-xs text-amber-700 mt-1">Verifikasi di hub tujuan</p>
        </div>
      </section>
      <section>
        <h2 class="font-bold mb-2">
          Status Alur Mutasi Aktif &amp; Shuttle Antar-Hub
        </h2>
        <div class="grid md:grid-cols-2 xl:grid-cols-4 gap-4">
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>MT-2025-0142</b><span class="badge b-blue">Antar-Hub</span>
            </div>
            <p class="font-semibold text-sm mt-2">DC-01 → Hub Surabaya DC-02</p>
            <p class="text-xs text-slate-500 mb-3">
              Armada Van Shuttle B 9421 KLA · 120 Unit
            </p>
            <div class="bar"><i style="width: 65%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">Dalam pengiriman 65%</p>
          </div>
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>MT-2025-0143</b><span class="badge b-green">Intra-Gudang</span>
            </div>
            <p class="font-semibold text-sm mt-2">
              Zona A → Zona C (Picking Area)
            </p>
            <p class="text-xs text-slate-500 mb-3">
              Forklift Elektrik FL-02 · 80 Unit
            </p>
            <div class="bar"><i style="width: 90%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">Proses pindah rak 90%</p>
          </div>
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>MT-2025-0144</b><span class="badge b-blue">Antar-Hub</span>
            </div>
            <p class="font-semibold text-sm mt-2">DC-01 → Hub Bandung DC-03</p>
            <p class="text-xs text-slate-500 mb-3">
              Truck Box B 9012 PQR · 250 Unit
            </p>
            <div class="bar"><i style="width: 30%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">Staging transit 30%</p>
          </div>
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>MT-2025-0145</b><span class="badge b-amber">Antar-Zona</span>
            </div>
            <p class="font-semibold text-sm mt-2">
              Zona E → Zona B (Aksesoris)
            </p>
            <p class="text-xs text-slate-500 mb-3">
              Hand Pallet HP-05 · 150 Master Box
            </p>
            <div class="bar"><i style="width: 0%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">Menunggu verifikasi</p>
          </div>
        </div>
      </section>
      <div class="card flex flex-wrap gap-2">
        <input
          class="flex-1 min-w-[220px] bg-slate-100 rounded-lg px-3 py-2 text-xs"
          placeholder="Cari No. Mutasi (MT), SKU, rak asal / tujuan, PIC..."
        /><select class="btn font-normal">
          <option>Tipe Mutasi: Semua</option></select
        ><select class="btn font-normal">
          <option>Status Mutasi (Semua)</option></select
        ><select class="btn font-normal">
          <option>Zona: Semua Zona</option>
        </select>
      </div>
      <section class="card p-0 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[900px]">
            <thead>
              <tr>
                <th class="th">NO. MUTASI &amp; TANGGAL</th>
                <th class="th">TIPE</th>
                <th class="th">LOKASI ASAL → TUJUAN</th>
                <th class="th">DETAIL KOMODITAS / SKU</th>
                <th class="th">TOTAL QTY</th>
                <th class="th">PIC PENGIRIM &amp; PENERIMA</th>
                <th class="th">STATUS</th>
                <th class="th">AKSI</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="td">
                  <b class="sku">MT-2025-0140</b><br />12 Mar 2025, 08:30
                </td>
                <td class="td"><span class="badge b-blue">Antar-Hub</span></td>
                <td class="td">Hub Cakung DC-01 → Hub Surabaya DC</td>
                <td class="td">MacBook Pro M1 2020</td>
                <td class="td">40 Unit</td>
                <td class="td">Ir. Bambang S. → Slamet R.</td>
                <td class="td">
                  <span class="badge b-green">Selesai Diterima</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">MT-2025-0141</b><br />12 Mar 2025, 09:15
                </td>
                <td class="td">
                  <span class="badge b-green">Intra-Gudang</span>
                </td>
                <td class="td">WH01-ZA-RA01 → WH01-ZC-RC02</td>
                <td class="td">Sandisk SSD NVMe 1TB</td>
                <td class="td">120 Unit</td>
                <td class="td">Hendra W. → Agus S.</td>
                <td class="td">
                  <span class="badge b-green">Selesai Relokasi</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">MT-2025-0142</b><br />12 Mar 2025, 10:00
                </td>
                <td class="td"><span class="badge b-blue">Antar-Hub</span></td>
                <td class="td">Hub Cakung DC-01 → Hub Bandung DC-03</td>
                <td class="td">Sony WH-1000XM4 Audio</td>
                <td class="td">85 Unit</td>
                <td class="td">Rizky P. → Hendra K.</td>
                <td class="td">
                  <span class="badge b-blue">Dalam Perjalanan</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">MT-2025-0143</b><br />12 Mar 2025, 10:45
                </td>
                <td class="td">
                  <span class="badge b-green">Intra-Gudang</span>
                </td>
                <td class="td">WH02-ZD-RD01 → WH01-ZB-RB01</td>
                <td class="td">Mechanical Keyboard RGB</td>
                <td class="td">50 Unit</td>
                <td class="td">Maya A. → Dedi K.</td>
                <td class="td">
                  <span class="badge b-amber">Proses Pindah</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">MT-2025-0145</b><br />12 Mar 2025, 11:50
                </td>
                <td class="td">
                  <span class="badge b-amber">Antar-Zona</span>
                </td>
                <td class="td">Buffer Dock 01 → WH03-ZE-RE01</td>
                <td class="td">Barcode Scanner &amp; Printer</td>
                <td class="td">60 Unit</td>
                <td class="td">Siti N. → Kusnadi</td>
                <td class="td">
                  <span class="badge b-slate">Menunggu Verifikasi</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="p-3 text-xs text-slate-500 border-t border-slate-100">
          Menampilkan 1 - 5 dari 24 transaksi mutasi
        </p>
      </section>
    </template>
    <script>
      // Memuat layout bersama (butuh server lokal, mis. Live Server)
      fetch("../layouts/MainLayout.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("app").innerHTML = h;
          document
            .getElementById("content")
            .append(document.getElementById("page").content);
          document
            .querySelector('[data-nav="' + document.body.dataset.active + '"]')
            ?.classList.add("nav-active");
        });
    </script>
  </body>
</html>
