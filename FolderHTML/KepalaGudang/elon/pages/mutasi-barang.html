    <!-- LUCIDE ICON -->

    <!-- GLOBAL CSS -->

    <style>
      /* =========================================
         MUTASI BARANG - PAGE STYLE
         Standar ukuran mengikuti Data Barang
      ========================================= */

      #content {
        width: 100%;
        min-width: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px !important;
        line-height: 1.5;
        color: #172033;
      }

      #content *,
      #content *::before,
      #content *::after {
        box-sizing: border-box;
      }

      /* TYPOGRAPHY */

      #content h1 {
        margin: 0;
        font-size: 22px !important;
        line-height: 1.35 !important;
        font-weight: 700;
        letter-spacing: -0.35px;
      }

      #content h2 {
        font-size: 14px !important;
        line-height: 1.45;
        font-weight: 700;
      }

      #content p {
        line-height: 1.5;
      }

      #content .text-3xl {
        font-size: 30px !important;
        line-height: 1.3 !important;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      #content .text-xl {
        font-size: 22px !important;
      }

      #content .text-lg {
        font-size: 17px !important;
      }

      #content .text-sm {
        font-size: 12px !important;
      }

      #content .text-xs {
        font-size: 11px !important;
      }

      #content .text-\[9px\] {
        font-size: 9px !important;
      }

      #content .text-\[10px\] {
        font-size: 10px !important;
      }

      #content .text-\[11px\] {
        font-size: 11px !important;
      }

      /* LUCIDE ICON */

      #content svg,
      #sidebar svg,
      .astro-topbar svg {
        display: inline-block;
        flex-shrink: 0;
        vertical-align: middle;
        visibility: visible;
        opacity: 1;
      }

      #content i[data-lucide] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
      }

      #content .icon-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border-radius: 10px;
      }

      /* CARD */

      #content .card {
        min-width: 0;
        padding: 14px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      }

      #content .card.p-0 {
        padding: 0 !important;
      }

      /* BUTTON */

      /* BUTTON */

      #content button,
      #content .btn {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px !important;
        font-weight: 600;
        line-height: 1.4;
        cursor: pointer;
        transition: all 0.18s ease;
      }

      #content .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid #dbe4f0;
        border-radius: 9px;
        background: #fff;
        color: #183153;
        white-space: nowrap;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.035);
      }

      #content .btn:hover {
        background: #f5f8ff;
        border-color: #93b4f5;
        color: #1d4ed8;
      }

      #content .btn-primary {
        background: #1d4ed8;
        color: #fff;
        border-color: #1d4ed8;
        box-shadow: 0 2px 5px rgba(29, 78, 216, 0.18);
      }

      #content .btn-primary:hover {
        background: #1e40af;
        border-color: #1e40af;
        color: #fff;
      }

      #content button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
      }

      #content .btn svg {
        width: 15px;
        height: 15px;
      }

      /* INPUT */

      #content input[type="text"] {
        display: block;
        width: 100%;
        min-width: 0;
        height: 38px;
        padding: 8px 12px 8px 36px;
        border: 1px solid #dbe4f0;
        border-radius: 9px;
        background: #f8fafc;
        color: #334155;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px !important;
        line-height: 1.4;
        outline: none;
      }

      #content input[type="text"]::placeholder {
        color: #94a3b8;
      }

      #content input[type="text"]:focus {
        border-color: #93b4f5;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
      }

      /* DROPDOWN */

      #content select {
        display: inline-flex;
        align-items: center;
        width: auto;
        max-width: 100%;
        min-height: 36px;
        height: 36px;
        padding: 6px 28px 6px 10px;
        border: 1px solid #dbe4f0;
        border-radius: 9px;
        background-color: #ffffff;
        color: #334155;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px !important;
        font-weight: 500;
        line-height: 1.3;
        outline: none;
      }

      #content select:focus {
        border-color: #93b4f5;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
      }

      /* BADGE */

      #content .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        max-width: 100%;
        padding: 5px 9px;
        border: 1px solid transparent;
        border-radius: 6px;
        font-size: 10px !important;
        font-weight: 600;
        line-height: 1.35;
        white-space: nowrap;
      }

      #content .b-blue {
        color: #1d4ed8;
        background: #eff6ff;
      }

      #content .b-green {
        color: #15803d;
        background: #f0fdf4;
      }

      #content .b-amber {
        color: #b45309;
        background: #fffbeb;
      }

      #content .b-red {
        color: #b91c1c;
        background: #fef2f2;
      }

      #content .b-slate {
        color: #475569;
        background: #f1f5f9;
      }

      #content .quick-mutasi {
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #content .quick-mutasi:hover {
        filter: brightness(0.97);
      }

      #content .quick-mutasi.active {
        outline: 2px solid rgba(37, 99, 235, 0.22);
        outline-offset: 1px;
      }

      /* TABLE */

      #content .overflow-x-auto {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: thin;
        scrollbar-color: #94a3b8 #f1f5f9;
      }

      #content .overflow-x-auto::-webkit-scrollbar {
        height: 8px;
      }

      #content .overflow-x-auto::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 10px;
      }

      #content .overflow-x-auto::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
      }

      #content table {
        width: 100%;
        min-width: 1220px;
        border-collapse: collapse;
        border-spacing: 0;
        table-layout: auto;
      }

      #content thead {
        background: #f8fafc;
      }

      #content th.th {
        padding: 13px 9px;
        border-bottom: 1px solid #e2e8f0;
        color: #475569;
        font-size: 11px !important;
        font-weight: 700;
        line-height: 1.4;
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
      }

      #content td.td {
        padding: 12px 9px;
        border-bottom: 1px solid #edf1f6;
        color: #334155;
        font-size: 12px !important;
        line-height: 1.5;
        vertical-align: middle;
      }

      #content tbody tr {
        transition: background 0.15s ease;
      }

      #content tbody tr:hover {
        background: #f8fafc;
      }

      #content tbody tr:last-child td {
        border-bottom: none;
      }

      #content .sku {
        color: #1d4ed8;
        font-size: 12px !important;
        font-weight: 700;
      }

      #content td.td:last-child {
        min-width: 75px;
        text-align: center;
        white-space: nowrap;
      }

      #content td.td button {
        padding: 5px 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #1d4ed8;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px !important;
        font-weight: 600;
        cursor: pointer;
      }

      #content td.td button:hover {
        background: #eff6ff;
      }

      /* TABLE FOOTER */

      #content .border-t,
      #content .border-b {
        border-color: #e2e8f0;
      }

      #content .border-slate-100 {
        border-color: #edf1f6;
      }

      #content .p-3 {
        padding: 12px;
      }

      #content .p-4 {
        padding: 14px;
      }

      /* RESPONSIVE */

      @media (max-width: 1024px) {
        #content .text-3xl {
          font-size: 26px !important;
        }

        #content .card {
          padding: 12px;
        }

        #content .card.p-0 {
          padding: 0 !important;
        }
      }

      @media (max-width: 768px) {
        #content h1 {
          font-size: 19px !important;
        }

        #content h2 {
          font-size: 13px !important;
        }

        #content .text-3xl {
          font-size: 25px !important;
        }

        #content .btn {
          min-height: 34px;
          padding: 7px 10px;
          font-size: 11px !important;
        }

        #content select {
          height: 34px;
          min-height: 34px;
          font-size: 11px !important;
        }

        #content input[type="text"] {
          height: 36px;
          font-size: 11px !important;
        }

        #content th.th {
          padding: 11px 8px;
          font-size: 10px !important;
        }

        #content td.td {
          padding: 10px 8px;
          font-size: 11px !important;
        }

        #content .card {
          border-radius: 10px;
        }

        #content .card.p-0 {
          padding: 0 !important;
        }
      }

      @media (max-width: 480px) {
        #content .text-3xl {
          font-size: 22px !important;
        }

        #content .card {
          padding: 11px;
        }

        #content .card.p-0 {
          padding: 0 !important;
        }
      }
    </style>
  </head>

  <body data-active="mutasi-barang" class="bg-slate-50 text-slate-900">

    <!-- MAIN LAYOUT SCRIPT -->
    <script src="../layouts/main-layout.js"></script>

    <script>
      /* =========================================
         RENDER LUCIDE ICON
      ========================================= */

      function renderLucideIcons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons({
            attrs: {
              "stroke-width": 1.8,
            },
          });
        }
      }

      /* =========================================
         LOAD MAIN LAYOUT
      ========================================= */

      fetch("../layouts/MainLayout.html")
        .then((response) => {
          if (!response.ok) {
            throw new Error(
              "MainLayout.html tidak ditemukan: " + response.status,
            );
          }

          return response.text();
        })
        .then((html) => {
          const app = document.getElementById("app");

          if (!app) {
            throw new Error("Elemen #app tidak ditemukan.");
          }

          /* MASUKKAN MAIN LAYOUT */
          app.innerHTML = html;

          /* AMBIL CONTENT */
          const content = document.getElementById("content");

          if (!content) {
            throw new Error(
              "Elemen #content tidak ditemukan di MainLayout.html.",
            );
          }

          /* AMBIL TEMPLATE */
          const pageTemplate = document.getElementById("page");

          if (!pageTemplate) {
            throw new Error("Template #page tidak ditemukan.");
          }

          /* MASUKKAN KONTEN HALAMAN */
          content.appendChild(pageTemplate.content.cloneNode(true));

          /* INISIALISASI MAIN LAYOUT */
          if (typeof window.initMainLayout === "function") {
            window.initMainLayout();
          }

          /* NAVIGASI AKTIF */
          const activePage = document.body.dataset.active;

          document.querySelectorAll(".nav-link").forEach((link) => {
            const isActive = link.dataset.nav === activePage;

            link.classList.toggle("active", isActive);
            link.classList.toggle("nav-active", isActive);

            if (isActive) {
              link.setAttribute("aria-current", "page");
            } else {
              link.removeAttribute("aria-current");
            }
          });

          /* RENDER IKON SETELAH LAYOUT DAN KONTEN DIMUAT */
          renderLucideIcons();

          if (typeof window.refreshLucideIcons === "function") {
            window.refreshLucideIcons();
          }

          /* AKTIFKAN INTERAKSI HALAMAN */
          initMutasiBarang();
        })
        .catch((error) => {
          console.error("Gagal memuat halaman:", error);

          const app = document.getElementById("app");

          if (app) {
            app.innerHTML = `
              <div class="p-6 text-red-600">
                Gagal memuat layout. Periksa lokasi MainLayout.html,
                main-layout.js, dan koneksi internet.
              </div>
            `;
          }
        });

      /* =========================================
         INTERAKSI MUTASI BARANG
      ========================================= */

      function initMutasiBarang() {
        const search = document.getElementById("searchMutasi");
        const asal = document.getElementById("filterAsal");
        const tujuan = document.getElementById("filterTujuan");
        const status = document.getElementById("filterStatus");
        const resetButton = document.getElementById("resetMutasi");
        const refreshButton = document.getElementById("refreshMutasi");
        const totalMutasi = document.getElementById("totalMutasi");
        const quickButtons = document.querySelectorAll(".quick-mutasi");
        const table = document.getElementById("mutasiTable");
        const limitSelect = document.getElementById("limitMutasi");

        if (!search || !asal || !tujuan || !status || !table || !totalMutasi) {
          console.error("Elemen filter mutasi tidak lengkap.");
          return;
        }

        const rows = Array.from(table.querySelectorAll("tr"));

        let quickStatus = "";
        let currentLimit = Number(limitSelect?.value || 10);

        /* FILTER DATA */
        function filterMutasi() {
          const keyword = search.value.trim().toLowerCase();

          const filteredRows = rows.filter((row) => {
            const cocokCari = row.innerText.toLowerCase().includes(keyword);

            const cocokAsal = !asal.value || row.dataset.origin === asal.value;

            const cocokTujuan =
              !tujuan.value || row.dataset.destination === tujuan.value;

            const cocokStatus =
              !status.value || row.dataset.status === status.value;

            const cocokQuick =
              !quickStatus || row.dataset.status === quickStatus;

            return (
              cocokCari && cocokAsal && cocokTujuan && cocokStatus && cocokQuick
            );
          });

          rows.forEach((row) => {
            row.style.display = "none";
          });

          filteredRows.slice(0, currentLimit).forEach((row) => {
            row.style.display = "";
          });

          const total = filteredRows.length;
          const tampil = Math.min(total, currentLimit);

          if (total === 0) {
            totalMutasi.textContent = "Tidak ada transaksi yang ditemukan";
          } else {
            totalMutasi.textContent =
              "Menampilkan 1 - " + tampil + " dari " + total + " transaksi";
          }
        }

        /* EVENT PENCARIAN */
        search.addEventListener("input", filterMutasi);

        /* EVENT DROPDOWN */
        asal.addEventListener("change", filterMutasi);
        tujuan.addEventListener("change", filterMutasi);
        status.addEventListener("change", filterMutasi);

        /* FILTER CEPAT */
        quickButtons.forEach((button) => {
          button.addEventListener("click", () => {
            quickButtons.forEach((item) => {
              item.classList.remove("active");
            });

            button.classList.add("active");

            quickStatus = button.dataset.status || "";

            status.value = "";

            filterMutasi();
          });
        });

        /* RESET FILTER */
        function resetFilter() {
          search.value = "";
          asal.value = "";
          tujuan.value = "";
          status.value = "";

          quickStatus = "";

          quickButtons.forEach((item) => {
            item.classList.remove("active");
          });

          if (quickButtons.length > 0) {
            quickButtons[0].classList.add("active");
          }

          currentLimit = Number(limitSelect?.value || 10);

          filterMutasi();
        }

        resetButton?.addEventListener("click", resetFilter);

        /* REFRESH TAMPILAN */
        refreshButton?.addEventListener("click", () => {
          resetFilter();

          const icon = refreshButton.querySelector("svg");

          if (icon) {
            icon.style.transition = "transform 0.5s ease";
            icon.style.transform = "rotate(360deg)";

            setTimeout(() => {
              icon.style.transform = "rotate(0deg)";
            }, 500);
          }
        });

        /* JUMLAH BARIS */
        limitSelect?.addEventListener("change", () => {
          currentLimit = Number(limitSelect.value) || 10;
          filterMutasi();
        });

        /* TOMBOL DETAIL */
        document.querySelectorAll(".detail-mutasi").forEach((button) => {
          button.addEventListener("click", () => {
            const row = button.closest("tr");

            if (!row) return;

            const nomorMutasi =
              row.querySelector(".sku")?.textContent.trim() || "-";

            const detailBarang =
              row.querySelector("td:nth-child(3) b")?.textContent.trim() || "-";

            const gudangAsal =
              row.querySelector("td:nth-child(4)")?.textContent.trim() || "-";

            const gudangTujuan =
              row.querySelector("td:nth-child(5)")?.textContent.trim() || "-";

            const jumlah =
              row.querySelector("td:nth-child(6)")?.textContent.trim() || "-";

            const petugas =
              row.querySelector("td:nth-child(7)")?.textContent.trim() || "-";

            const statusMutasi = row.dataset.status || "-";

            alert(
              "DETAIL TRANSAKSI MUTASI\n\n" +
                "Nomor Mutasi: " +
                nomorMutasi +
                "\n" +
                "Nama Barang: " +
                detailBarang +
                "\n" +
                "Gudang Asal: " +
                gudangAsal +
                "\n" +
                "Gudang Tujuan: " +
                gudangTujuan +
                "\n" +
                "Jumlah: " +
                jumlah +
                "\n" +
                "Petugas: " +
                petugas +
                "\n" +
                "Status: " +
                statusMutasi,
            );
          });
        });

        /* TAMPILKAN DATA AWAL */
        filterMutasi();
      }
    </script>
