<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Barang Keluar | Astro Inventory</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body data-active="barang-keluar" class="bg-slate-50 text-slate-900">
    <div id="app" class="flex min-h-screen"></div>
    <template id="page">
      <div>
        <p class="text-[11px] text-slate-500">
          OPERASIONAL &amp; TRANSAKSI &gt; TRANSAKSI BARANG KELUAR (OUTBOUND DC)
        </p>
        <div class="flex flex-wrap items-start justify-between gap-3 mt-1">
          <div>
            <h1 class="text-2xl font-bold">
              Transaksi Barang Keluar (Outbound DC)
            </h1>
            <p class="text-sm text-slate-600 max-w-2xl">
              Monitoring pengeluaran inventaris untuk distribusi antar-cabang,
              permintaan divisi internal, validasi Surat Jalan Keluar (DO/SJ),
              dan verifikasi serah terima armada.
            </p>
          </div>
          <div class="flex gap-2">
            <button class="btn">Ekspor Data Outbound</button
            ><button class="btn">Jadwal Dispatch Armada</button
            ><button class="btn btn-primary">
              + Buat Pengeluaran Barang Baru
            </button>
          </div>
        </div>
      </div>
      <section class="grid grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="card">
          <p class="text-xs text-slate-500">Total Keluar Hari Ini</p>
          <p class="text-3xl font-bold mt-1">1.180 Unit</p>
          <p class="text-xs text-green-700 mt-1">22 order selesai dikirim</p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Permintaan / DO Dalam Proses</p>
          <p class="text-3xl font-bold mt-1">11 Berkas</p>
          <p class="text-xs text-slate-500 mt-1">
            7 selesai packing · 4 sedang picking
          </p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">
            Akurasi Picking &amp; QC Outbound
          </p>
          <p class="text-3xl font-bold mt-1">99,8%</p>
          <p class="text-xs text-green-700 mt-1">
            1.178 unit lolos · 2 ganti SKU
          </p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Menunggu Muat / Dispatch</p>
          <p class="text-3xl font-bold mt-1">240 Unit</p>
          <p class="text-xs text-amber-700 mt-1">
            Area staging outbound gate 03-05
          </p>
        </div>
      </section>
      <section>
        <h2 class="font-bold mb-2">
          Status Slot Loading Dock &amp; Antrean Armada Outbound
        </h2>
        <div class="grid md:grid-cols-2 xl:grid-cols-4 gap-4">
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>DOCK 01</b><span class="badge b-blue">Proses Muat</span>
            </div>
            <p class="font-semibold text-sm mt-2">Hub Surabaya DC-02</p>
            <p class="text-xs text-slate-500 mb-3">
              JNE Trucking B 9821 UXT · 380 Karton
            </p>
            <div class="bar"><i style="width: 85%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">Progress muat 85%</p>
          </div>
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>DOCK 02</b><span class="badge b-slate">Verifikasi DO</span>
            </div>
            <p class="font-semibold text-sm mt-2">
              Divisi Operasional &amp; IT Pusat
            </p>
            <p class="text-xs text-slate-500 mb-3">
              Kurir Internal Van B 1204 KLA
            </p>
            <div class="bar"><i style="width: 95%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">Scan barcode 95%</p>
          </div>
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>DOCK 03</b><span class="badge b-amber">Staging Pallet</span>
            </div>
            <p class="font-semibold text-sm mt-2">Hub Bandung DC-03</p>
            <p class="text-xs text-slate-500 mb-3">
              SiCepat Cargo B 9331 XJ · 420 Master Box
            </p>
            <div class="bar"><i style="width: 45%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">Picking gudang 45%</p>
          </div>
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>DOCK 04</b><span class="badge b-slate">Menunggu Truk</span>
            </div>
            <p class="font-semibold text-sm mt-2">
              Divisi Maintenance &amp; GA
            </p>
            <p class="text-xs text-slate-500 mb-3">
              Pick-up internal DC · 80 unit
            </p>
            <div class="bar"><i style="width: 0%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">
              Estimasi tiba 10:45 WIB
            </p>
          </div>
        </div>
      </section>
      <div class="card flex flex-wrap gap-2">
        <input
          class="flex-1 min-w-[220px] bg-slate-100 rounded-lg px-3 py-2 text-xs"
          placeholder="Cari nomor DO, surat jalan, divisi / cabang tujuan..."
        /><select class="btn font-normal">
          <option>Semua Tujuan</option></select
        ><select class="btn font-normal">
          <option>Status Pengeluaran (Semua)</option></select
        ><select class="btn font-normal">
          <option>Jenis Pengiriman: Semua</option>
        </select>
      </div>
      <section class="card p-0 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[900px]">
            <thead>
              <tr>
                <th class="th">NO. DO &amp; SURAT JALAN</th>
                <th class="th">TUJUAN &amp; PIC PENERIMA</th>
                <th class="th">DETAIL KOMODITAS</th>
                <th class="th">TOTAL QTY</th>
                <th class="th">GATE / STAGING RAK</th>
                <th class="th">STATUS DISPATCH &amp; QC</th>
                <th class="th">AKSI</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="td">
                  <b class="sku">DO-2025-0641</b><br />SJ-4412/OUT-JKT
                </td>
                <td class="td">Hub Surabaya DC-02<br />PIC: Slamet Riyadi</td>
                <td class="td">MacBook Pro M1 &amp; Workstation</td>
                <td class="td">60 Unit</td>
                <td class="td">WH01-ZA-RA02</td>
                <td class="td">
                  <span class="badge b-green">Selesai Dispatch</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">DO-2025-0642</b><br />SJ-4413/OUT-JKT
                </td>
                <td class="td">
                  Divisi IT &amp; Infrastruktur<br />PIC: Adrian Pratama
                </td>
                <td class="td">Mechanical Keyboard RGB &amp; Mouse</td>
                <td class="td">45 Unit</td>
                <td class="td">WH01-ZB-RB01</td>
                <td class="td">
                  <span class="badge b-green">Selesai Diserahkan</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">DO-2025-0643</b><br />SJ-4414/OUT-JKT
                </td>
                <td class="td">Hub Bandung DC-03<br />PIC: Hendra K.</td>
                <td class="td">Sony WH-1000XM4 &amp; Audio System</td>
                <td class="td">120 Unit</td>
                <td class="td">WH01-ZB-RB02</td>
                <td class="td">
                  <span class="badge b-blue">Proses Muat Dock 01 (85%)</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">DO-2025-0644</b><br />SJ-4415/OUT-JKT
                </td>
                <td class="td">
                  Divisi Operasional &amp; Hub<br />PIC: Bambang Sugiarto
                </td>
                <td class="td">Barcode Scanner Zebra &amp; Label Roll</td>
                <td class="td">35 Unit</td>
                <td class="td">WH02-RD01</td>
                <td class="td">
                  <span class="badge b-amber">Sedang Picking</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="p-3 text-xs text-slate-500 border-t border-slate-100">
          Menampilkan 1 - 4 dari 16 transaksi outbound
        </p>
      </section>
    </template>
    <script>
      // Memuat layout bersama (butuh server lokal, mis. Live Server)
      fetch("../layouts/MainLayout.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("app").innerHTML = h;
          document
            .getElementById("content")
            .append(document.getElementById("page").content);
          document
            .querySelector('[data-nav="' + document.body.dataset.active + '"]')
            ?.classList.add("nav-active");
        });
    </script>
  </body>
</html>
