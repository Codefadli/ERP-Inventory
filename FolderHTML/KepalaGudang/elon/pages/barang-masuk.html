<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Barang Masuk | Astro Inventory</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body data-active="barang-masuk" class="bg-slate-50 text-slate-900">
    <div id="app" class="flex min-h-screen"></div>
    <template id="page">
      <div>
        <p class="text-[11px] text-slate-500">
          OPERASIONAL &amp; TRANSAKSI &gt; TRANSAKSI BARANG MASUK (INBOUND DC)
        </p>
        <div class="flex flex-wrap items-start justify-between gap-3 mt-1">
          <div>
            <h1 class="text-2xl font-bold">
              Transaksi Barang Masuk (Inbound DC)
            </h1>
            <p class="text-sm text-slate-600 max-w-2xl">
              Monitoring penerimaan logistik dari pemasok, validasi Purchase
              Order (PO), inspeksi Quality Control (QC), Berita Acara Serah
              Terima, dan alokasi rak putaway.
            </p>
          </div>
          <div class="flex gap-2">
            <button class="btn">Ekspor Data Inbound</button
            ><button class="btn">Jadwal Kedatangan Dock</button
            ><button class="btn btn-primary">
              + Catat Penerimaan Barang Masuk
            </button>
          </div>
        </div>
      </div>
      <section class="grid grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="card">
          <p class="text-xs text-slate-500">Total Masuk Hari Ini</p>
          <p class="text-3xl font-bold mt-1">1.420 Unit</p>
          <p class="text-xs text-green-700 mt-1">
            18 SKU terverifikasi lengkap
          </p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">PO Dalam Proses Inbound</p>
          <p class="text-3xl font-bold mt-1">14 Berkas</p>
          <p class="text-xs text-slate-500 mt-1">
            8 selesai · 6 sedang bongkar
          </p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Lolos Uji Quality Control</p>
          <p class="text-3xl font-bold mt-1">99,4%</p>
          <p class="text-xs text-green-700 mt-1">
            1.412 diterima · 8 karantina
          </p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Menunggu Putaway / Staging</p>
          <p class="text-3xl font-bold mt-1">320 Unit</p>
          <p class="text-xs text-amber-700 mt-1">
            Area transit inbound dock 01-03
          </p>
        </div>
      </section>
      <section>
        <h2 class="font-bold mb-2">
          Status Slot Loading Dock &amp; Antrean Truk Pemasok
        </h2>
        <div class="grid md:grid-cols-2 xl:grid-cols-4 gap-4">
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>DOCK 01</b><span class="badge b-blue">Proses Bongkar</span>
            </div>
            <p class="font-semibold text-sm mt-2">PT Surya Elektronik</p>
            <p class="text-xs text-slate-500 mb-3">
              PO-2025-0891 · Box Kamera &amp; Lensa
            </p>
            <div class="bar"><i style="width: 75%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">Bongkar muat 75%</p>
          </div>
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>DOCK 02</b><span class="badge b-green">Inspeksi QC</span>
            </div>
            <p class="font-semibold text-sm mt-2">CV Digital Mandiri</p>
            <p class="text-xs text-slate-500 mb-3">
              PO-2025-0894 · Laptop &amp; PC
            </p>
            <div class="bar"><i style="width: 90%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">QC sampling 90%</p>
          </div>
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>DOCK 03</b><span class="badge b-slate">Masuk Rak</span>
            </div>
            <p class="font-semibold text-sm mt-2">PT Logistik Pack</p>
            <p class="text-xs text-slate-500 mb-3">
              PO-2025-0899 · Dus &amp; Bubble Wrap
            </p>
            <div class="bar"><i style="width: 40%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">
              Putaway rak transit 40%
            </p>
          </div>
          <div class="card">
            <div class="flex justify-between text-xs">
              <b>DOCK 04</b><span class="badge b-slate">Menunggu Giliran</span>
            </div>
            <p class="font-semibold text-sm mt-2">PT Bintang Audio</p>
            <p class="text-xs text-slate-500 mb-3">
              PO-2025-0902 · Audio &amp; Headset
            </p>
            <div class="bar"><i style="width: 0%"></i></div>
            <p class="text-[11px] text-slate-500 mt-1">
              Tiba di gerbang 10:15 WIB
            </p>
          </div>
        </div>
      </section>
      <div class="card flex flex-wrap gap-2">
        <input
          class="flex-1 min-w-[220px] bg-slate-100 rounded-lg px-3 py-2 text-xs"
          placeholder="Cari nomor PO, surat jalan, nama supplier, atau SKU..."
        /><select class="btn font-normal">
          <option>Semua Supplier</option></select
        ><select class="btn font-normal">
          <option>Status Penerimaan (Semua)</option></select
        ><select class="btn font-normal">
          <option>Metode QC: Semua</option>
        </select>
      </div>
      <section class="card p-0 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[900px]">
            <thead>
              <tr>
                <th class="th">NO. PO &amp; SURAT JALAN</th>
                <th class="th">SUPPLIER &amp; PIC EKSPEDISI</th>
                <th class="th">DETAIL KOMODITAS</th>
                <th class="th">TOTAL QTY</th>
                <th class="th">LOKASI STAGING / RAK</th>
                <th class="th">HASIL QC &amp; STATUS</th>
                <th class="th">AKSI</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="td">
                  <b class="sku">PO-2025-0891</b
                  ><br />SJ-88219/SE-JKT<br />Tiba: 07:45 WIB
                </td>
                <td class="td">PT Surya Elektronik</td>
                <td class="td">Kamera &amp; Optik · 4 sub-SKU</td>
                <td class="td">450 Box</td>
                <td class="td">WH01-ZA-RA01</td>
                <td class="td">
                  <span class="badge b-green">Selesai Putaway</span><br />Lolos
                  QC 100%
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">PO-2025-0894</b><br />Tiba: 08:30 WIB
                </td>
                <td class="td">CV Digital Mandiri</td>
                <td class="td">Laptop &amp; PC Stn</td>
                <td class="td">200 Unit</td>
                <td class="td">WH01-ZA-RA02</td>
                <td class="td">
                  <span class="badge b-amber">Inspeksi QC</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">PO-2025-0899</b><br />Tiba: 09:10 WIB
                </td>
                <td class="td">PT Logistik Pack</td>
                <td class="td">Dus &amp; Bubble Wrap</td>
                <td class="td">1.200 Kg</td>
                <td class="td">WH03-ZE-RE01</td>
                <td class="td"><span class="badge b-blue">Masuk Rak</span></td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">PO-2025-0902</b><br />Tiba: 10:15 WIB
                </td>
                <td class="td">PT Bintang Audio</td>
                <td class="td">Audio &amp; Headset</td>
                <td class="td">180 Unit</td>
                <td class="td">Dock Gate 04</td>
                <td class="td">
                  <span class="badge b-slate">Menunggu Giliran</span>
                </td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="p-3 text-xs text-slate-500 border-t border-slate-100">
          Menampilkan 1 - 4 dari 14 transaksi inbound
        </p>
      </section>
    </template>
    <script>
      // Memuat layout bersama (butuh server lokal, mis. Live Server)
      fetch("../layouts/MainLayout.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("app").innerHTML = h;
          document
            .getElementById("content")
            .append(document.getElementById("page").content);
          document
            .querySelector('[data-nav="' + document.body.dataset.active + '"]')
            ?.classList.add("nav-active");
        });
    </script>
  </body>
</html>
