         DATA BARANG - ASTRO INVENTORY
         STANDARD UI & TYPOGRAPHY
      ========================================= */

      html,

      }

        min-width: 0;
        font-size: 12px;
        line-height: 1.5;
      }

        font-size: 22px !important;
        line-height: 1.35;
        font-weight: 700;
        letter-spacing: -0.35px;
      }

      #page-content section:first-child > div p {

        line-height: 1.6;
      }

      #page-content section:first-child > p {

        line-height: 1.5;

         STATISTICS

        color: #1d4ed8;

        gap: 7px;
        padding: 8px 12px;
        border: 1px solid #dbe4f0;
        border-radius: 9px;
        background: #fff;
        color: #183153;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;

      #page-content .btn:hover:not(:disabled) {
        color: #1d4ed8;
        border-color: #93b4f5;
        background: #f5f8ff;
        box-shadow: 0 2px 7px rgba(37, 99, 235, 0.09);

        transform: translateY(1px);
      }

        cursor: not-allowed;
        opacity: 0.42;
        background: #f8fafc;
        box-shadow: none;
      }

      #page-content .btn.btn-primary {
        color: #fff;
        border-color: #1d4ed8;
        background: #1d4ed8;
        box-shadow: 0 2px 5px rgba(29, 78, 216, 0.18);

        color: #fff;
        border-color: #1e40af;
        background: #1e40af;
        box-shadow: 0 4px 10px rgba(29, 78, 216, 0.22);

      #page-content .btn svg {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
      }

      #page-content .btn:focus-visible,
      #page-content .db-quick:focus-visible,
      #page-content .db-action:focus-visible {
        outline: 3px solid rgba(59, 130, 246, 0.2);
        outline-offset: 2px;
      }

         SEARCH & FILTER
      ========================================= */

        height: 38px;

      ========================================= */

      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[char],
        );

      const rupiah = (value) =>
        "Rp " + Number(value || 0).toLocaleString("id-ID");

      const renderIcons = () => {
        if (window.lucide?.createIcons) {
          window.lucide.createIcons({
            attrs: {
              "stroke-width": 1.8,
            },
          });
        }
      };

      /* =========================================
         STATUS BADGE
      ========================================= */

      function statusMarkup(status) {
        const color =
          status === "Menipis"
            ? "text-red-600"
            : status === "Habis"
              ? "text-slate-500"
              : "text-green-700";

        return `
          <span class="db-status ${color}">
            <i class="db-status-dot"></i>
            ${esc(status)}
          </span>
        `;
      }

      /* =========================================
         RENDER TABEL
      ========================================= */

      function renderRows(rows) {
        const tbody = document.getElementById("barangTable");

        if (!tbody) return;

        if (!rows.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="10" class="py-12 text-center text-sm text-slate-400">
                <i
                  data-lucide="package-search"
                  class="mx-auto mb-2 h-8 w-8"
                ></i>
                Tidak ada barang yang ditemukan.
              </td>
            </tr>
          `;

          renderIcons();
          return;
        }

        tbody.innerHTML = rows
          .map(
            (item) => `
          <tr data-sku="${esc(item.sku)}">

            <td class="text-center">
              <input
                type="checkbox"
                class="row-check"
                aria-label="Pilih ${esc(item.sku)}"
              />
            </td>

            <td>
              <span class="sku-code">${esc(item.sku)}</span>
              <span class="ean-code">${esc(item.ean)}</span>
            </td>

            <td>
              <div class="flex items-center gap-2">
                <span class="db-icon">
                  <i data-lucide="${esc(item.icon)}" class="h-4 w-4"></i>
                </span>

                <div class="min-w-0">
                  <div class="product-name">
                    ${esc(item.nama)}
                  </div>
                  <div class="product-brand">
                    Brand: ${esc(item.brand)}
                  </div>
                </div>
              </div>
            </td>

            <td>${esc(item.kategori)}</td>

            <td>
              <span class="inline-flex items-center gap-1">
                <i
                  data-lucide="map-pin"
                  class="h-3 w-3 shrink-0 text-blue-600"
                ></i>
                ${esc(item.lokasi)}
              </span>
            </td>

            <td class="whitespace-nowrap">
              <b class="${
                item.status === "Menipis"
                  ? "text-red-600"
                  : item.status === "Habis"
                    ? "text-slate-500"
                    : "text-green-700"
              }">
                ${Number(item.stok).toLocaleString("id-ID")}
                ${esc(item.satuan)}
              </b>

              <span class="ml-2 text-[8px] text-slate-400">
                ROP: ${esc(item.rop)}
              </span>
            </td>

            <td>${esc(item.satuan)}</td>

            <td class="whitespace-nowrap font-semibold">
              ${rupiah(item.harga)}
            </td>

            <td>${statusMarkup(item.status)}</td>

            <td>
              <div class="flex items-center justify-center gap-1">

                <button
                  class="db-action"
                  type="button"
                  title="Detail"
                  aria-label="Detail ${esc(item.sku)}"
                  data-action="detail"
                  data-sku="${esc(item.sku)}"
                >
                  <i data-lucide="eye"></i>
                </button>

                <button
                  class="db-action"
                  type="button"
                  title="Edit"
                  aria-label="Edit ${esc(item.sku)}"
                  data-action="edit"
                  data-sku="${esc(item.sku)}"
                >
                  <i data-lucide="pencil"></i>
                </button>

                <button
                  class="db-action"
                  type="button"
                  title="Kelola Stok"
                  aria-label="Kelola stok ${esc(item.sku)}"
                  data-action="stock"
                  data-sku="${esc(item.sku)}"
                >
                  <i data-lucide="qr-code"></i>
                </button>

              </div>
            </td>
          </tr>
        `,
          )
          .join("");

        renderIcons();
      }

      /* =========================================
         LOAD MAIN LAYOUT
      ========================================= */

      async function loadMainLayout() {
        const app = document.getElementById("app");

        try {
          const response = await fetch("../layouts/MainLayout.html");

          if (!response.ok) {
            throw new Error(
              "MainLayout.html tidak ditemukan. Periksa lokasi file dan jalankan project melalui Live Server.",
            );
          }

          app.innerHTML = await response.text();

          const content = document.getElementById("content");

          if (!content) {
            throw new Error(
              "Elemen #content tidak ditemukan di MainLayout.html.",
            );
          }

          const pageTemplate = document.getElementById("page");

          if (!pageTemplate) {
            throw new Error("Template halaman #page tidak ditemukan.");
          }

          content.appendChild(pageTemplate.content.cloneNode(true));

          /* INISIALISASI LAYOUT */
          if (typeof window.initMainLayout === "function") {
            window.initMainLayout();
          }

          /* NAVIGASI AKTIF */
          document.querySelectorAll("[data-nav]").forEach((link) => {
            const isActive = link.dataset.nav === document.body.dataset.active;

            link.classList.toggle("nav-active", isActive);

            if (isActive) {
              link.setAttribute("aria-current", "page");
            } else {
              link.removeAttribute("aria-current");
            }
          });

          /* INISIALISASI DATA BARANG */
          initDataBarang();

          renderIcons();
        } catch (error) {
          console.error("Gagal memuat halaman:", error);

          app.innerHTML = `
            <div class="m-auto rounded-xl border border-red-200 bg-white p-6 text-center shadow-sm">
              <i
                data-lucide="alert-circle"
                class="mx-auto mb-3 h-9 w-9 text-red-600"
              ></i>

              <h2 class="mb-2 font-bold text-slate-900">
                Layout Gagal Dimuat
              </h2>

              <p class="text-sm text-slate-500">
                ${esc(error.message)}
              </p>

              <button
                onclick="location.reload()"
                type="button"
                class="btn btn-primary mt-4"
              >
                Muat Ulang
              </button>
            </div>
          `;

          renderIcons();
        }
      }

      /* =========================================
         FILTER DAN INTERAKSI DATA BARANG
      ========================================= */

      function initDataBarang() {
        const $ = (id) => document.getElementById(id);

        const search = $("searchBarang");
        const kategori = $("filterKategori");
        const status = $("filterStatus");
        const lokasi = $("filterLokasi");
        const quickButtons = [...document.querySelectorAll(".quick-filter")];

        let quickStatus = "";
        let currentPage = 1;
        let filtered = [...dataBarang];

        /* FILTER BARANG */
        function filterBarang() {
          const keyword = search.value.trim().toLocaleLowerCase("id");

          filtered = dataBarang.filter((item) => {
            const text = [
              item.sku,
              item.ean,
              item.nama,
              item.brand,
              item.kategori,
              item.lokasi,
            ]
              .join(" ")
              .toLocaleLowerCase("id");

            return (
              text.includes(keyword) &&
              (!kategori.value || item.kategori === kategori.value) &&
              (!status.value || item.status === status.value) &&
              (!lokasi.value || item.lokasi.startsWith(lokasi.value)) &&
              (!quickStatus ||
                (quickStatus === "fast"
                  ? item.fast
                  : item.status === quickStatus))
            );
          });

          currentPage = 1;
          renderTable();
        }

        /* PAGINATION */
        function renderTable() {
          const limit = Number($("jumlahBaris").value);
          const total = filtered.length;
          const pages = Math.max(1, Math.ceil(total / limit));

          currentPage = Math.min(currentPage, pages);

          const start = (currentPage - 1) * limit;
          const end = Math.min(start + limit, total);

          renderRows(filtered.slice(start, end));

          $("totalBarang").textContent = total
            ? `Menampilkan ${start + 1} - ${end} dari ${total} data contoh`
            : "Tidak ada barang ditemukan";

          $("pageInfo").textContent = `Halaman ${currentPage} dari ${pages}`;

          $("prevPage").disabled = currentPage <= 1;
          $("nextPage").disabled = currentPage >= pages;

          $("selectAll").checked = false;
          $("selectAll").indeterminate = false;
        }

        /* RESET FILTER */
        function resetFilters() {
          search.value = "";
          kategori.value = "";
          status.value = "";
          lokasi.value = "";
          quickStatus = "";

          quickButtons.forEach((button, index) => {
            button.classList.toggle("active", index === 0);
          });

          filterBarang();
        }

        /* SEARCH */
        search.addEventListener("input", filterBarang);

        /* DROPDOWN FILTER */
        kategori.addEventListener("change", filterBarang);
        lokasi.addEventListener("change", filterBarang);

        status.addEventListener("change", () => {
          quickStatus = "";

          quickButtons.forEach((button) => {
            button.classList.remove("active");
          });

          filterBarang();
        });

        /* QUICK FILTER */
        quickButtons.forEach((button) => {
          button.addEventListener("click", () => {
            quickButtons.forEach((item) => {
              item.classList.remove("active");
            });

            button.classList.add("active");

            quickStatus = button.dataset.status;
            status.value = "";

            filterBarang();
          });
        });

        /* RESET DAN REFRESH */
        $("resetFilter").addEventListener("click", resetFilters);
        $("refreshBarang").addEventListener("click", resetFilters);

        /* JUMLAH BARIS */
        $("jumlahBaris").addEventListener("change", () => {
          currentPage = 1;
          renderTable();
        });

        /* HALAMAN SEBELUMNYA */
        $("prevPage").addEventListener("click", () => {
          if (currentPage > 1) {
            currentPage--;
            renderTable();
          }
        });

        /* HALAMAN SELANJUTNYA */
        $("nextPage").addEventListener("click", () => {
          const pages = Math.ceil(
            filtered.length / Number($("jumlahBaris").value),
          );

          if (currentPage < pages) {
            currentPage++;
            renderTable();
          }
        });

        /* PILIH SEMUA */
        $("selectAll").addEventListener("change", (event) => {
          document
            .querySelectorAll("#barangTable .row-check")
            .forEach((checkbox) => {
              checkbox.checked = event.target.checked;
            });
        });

        /* UPDATE CHECKBOX */
        $("barangTable").addEventListener("change", (event) => {
          if (!event.target.matches(".row-check")) return;

          const checks = [
            ...document.querySelectorAll("#barangTable .row-check"),
          ];

          const count = checks.filter((checkbox) => checkbox.checked).length;

          $("selectAll").checked = checks.length > 0 && count === checks.length;

          $("selectAll").indeterminate = count > 0 && count < checks.length;
        });

        /* AKSI TABEL */
        $("barangTable").addEventListener("click", (event) => {
          const button = event.target.closest("[data-action]");

          if (!button) return;

          const item = dataBarang.find((row) => row.sku === button.dataset.sku);

          if (!item) return;

          /* DETAIL */
          if (button.dataset.action === "detail") {
            alert(
              `DETAIL BARANG

SKU: ${item.sku}
EAN: ${item.ean}
Nama: ${item.nama}
Brand: ${item.brand}
Kategori: ${item.kategori}
Lokasi: ${item.lokasi}
Stok: ${item.stok} ${item.satuan}
ROP: ${item.rop}
Nilai aset/unit: ${rupiah(item.harga)}
Status: ${item.status}`,
            );
          }

          /* EDIT */
          if (button.dataset.action === "edit") {
            const nextName = prompt("Ubah nama barang:", item.nama);

            if (nextName === null) return;

            const clean = nextName.trim();

            if (!clean) {
              alert("Nama barang tidak boleh kosong.");
              return;
            }

            item.nama = clean;
            renderTable();
          }

          /* KELOLA STOK */
          if (button.dataset.action === "stock") {
            alert(
              `INFORMASI STOK

SKU: ${item.sku}
Stok saat ini: ${item.stok} ${item.satuan}
ROP: ${item.rop}

Pengelolaan stok terhubung setelah database tersedia.`,
            );
          }
        });

        /* =========================================
           EXPORT CSV
        ========================================= */

        $("exportBarang").addEventListener("click", () => {
          const headers = [
            "SKU",
            "EAN",
            "Nama Barang",
            "Brand",
            "Kategori",
            "Lokasi",
            "Stok",
            "ROP",
            "Satuan",
            "Harga",
            "Status",
          ];

          const rows = filtered.map((item) => [
            item.sku,
            item.ean,
            item.nama,
            item.brand,
            item.kategori,
            item.lokasi,
            item.stok,
            item.rop,
            item.satuan,
            item.harga,
            item.status,
          ]);

          const csv = [headers, ...rows]
            .map((row) =>
              row
                .map((value) => `"${String(value).replace(/"/g, '""')}"`)
                .join(","),
            )
            .join("\r\n");

          const blob = new Blob(["\uFEFF" + csv], {
            type: "text/csv;charset=utf-8;",
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");

          link.href = url;
          link.download = "data-barang-astro-inventory.csv";

          document.body.appendChild(link);
          link.click();
          link.remove();

          URL.revokeObjectURL(url);
        });

        /* =========================================
           IMPORT CSV
        ========================================= */

        $("importBarang").addEventListener("click", () => {
          $("fileImport").click();
        });

        $("fileImport").addEventListener("change", async (event) => {
          const file = event.target.files[0];

          if (!file) return;

          try {
            const text = await file.text();

            const lines = text
              .replace(/^\uFEFF/, "")
              .split(/\r?\n/)
              .filter((line) => line.trim());

            if (lines.length < 2) {
              throw new Error("CSV tidak memiliki baris data.");
            }

            alert(
              `File "${file.name}" berhasil dibaca (${lines.length - 1} baris).

Pemetaan kolom dan penyimpanan database perlu disesuaikan dengan format CSV.`,
            );
          } catch (error) {
            alert("Import gagal: " + error.message);
          }

          event.target.value = "";
        });

        /* =========================================
           TAMBAH BARANG
        ========================================= */

        $("tambahBarang").addEventListener("click", () => {
          const sku = prompt("Masukkan kode SKU baru:");

          if (!sku) return;

          const cleanSku = sku.trim();

          if (!cleanSku) {
            alert("Kode SKU tidak boleh kosong.");
            return;
          }

          if (
            dataBarang.some(
              (item) => item.sku.toLowerCase() === cleanSku.toLowerCase(),
            )
          ) {
            alert("Kode SKU sudah terdaftar.");
            return;
          }

          const nama = prompt("Masukkan nama barang:");

          if (!nama || !nama.trim()) {
            alert("Nama barang tidak boleh kosong.");
            return;
          }

          const brand = prompt("Masukkan brand:") || "-";
          const ean = prompt("Masukkan barcode EAN:") || "-";

          const item = {
            sku: cleanSku,
            ean: ean.trim() || "-",
            nama: nama.trim(),
            brand: brand.trim() || "-",
            kategori: "Aksesoris Komputer",
            lokasi: "WH01-RA-01",
            stok: 0,
            rop: 0,
            satuan: "Unit",
            harga: 0,
            status: "Habis",
            icon: "package",
            fast: false,
          };

          dataBarang.unshift(item);

          resetFilters();
        });

        /* =========================================
           INISIALISASI AWAL
        ========================================= */

        filterBarang();
      }

      /* =========================================
         JALANKAN APLIKASI
      ========================================= */

      document.addEventListener("DOMContentLoaded", loadMainLayout);
    </script>
  </body>
</html>
