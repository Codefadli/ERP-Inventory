<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Data Barang | Astro Inventory</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body data-active="data-barang" class="bg-slate-50 text-slate-900">
    <div id="app" class="flex min-h-screen"></div>
    <template id="page">
      <div>
        <p class="text-[11px] text-slate-500">
          MASTER DATA &amp; INVENTARIS &gt; KATALOG SKU TERPADU
        </p>
        <div class="flex flex-wrap items-start justify-between gap-3 mt-1">
          <div>
            <h1 class="text-2xl font-bold">
              Data Master Barang &amp; Inventaris
            </h1>
            <p class="text-sm text-slate-600 max-w-2xl">
              Katalog terpusat seluruh SKU produk, klasifikasi kategori, status
              stok multi-gudang, harga acuan, dan unit penyimpanan fisik Hub
              DC-01.
            </p>
          </div>
          <div class="flex gap-2">
            <button class="btn">Ekspor Data</button
            ><button class="btn">Import Batch</button
            ><button class="btn btn-primary">+ Tambah Barang Baru</button>
          </div>
        </div>
      </div>
      <section class="grid grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="card">
          <p class="text-xs text-slate-500">Total SKU Terdaftar</p>
          <p class="text-3xl font-bold mt-1">8.650</p>
          <p class="text-xs text-green-700 mt-1">+142 SKU baru bulan ini</p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Total Unit Fisik</p>
          <p class="text-3xl font-bold mt-1">428.500</p>
          <p class="text-xs text-green-700 mt-1">98,4% akurasi stok audit</p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Stok Kritis (ROP)</p>
          <p class="text-3xl font-bold mt-1">24</p>
          <p class="text-xs text-red-700 mt-1">Perlu PO &amp; restock segera</p>
        </div>
        <div class="card">
          <p class="text-xs text-slate-500">Out of Stock</p>
          <p class="text-3xl font-bold mt-1">3</p>
          <p class="text-xs text-blue-700 mt-1">Dalam rute inbound supplier</p>
        </div>
      </section>
      <div class="card flex flex-wrap gap-2">
        <input
          class="flex-1 min-w-[220px] bg-slate-100 rounded-lg px-3 py-2 text-xs"
          placeholder="Cari SKU, nama produk, barcode EAN, brand..."
        /><select class="btn font-normal">
          <option>Semua Kategori</option></select
        ><select class="btn font-normal">
          <option>Semua Status Stok</option></select
        ><select class="btn font-normal">
          <option>Semua Lokasi Gudang</option>
        </select>
      </div>
      <section class="card p-0 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[900px]">
            <thead>
              <tr>
                <th class="th">KODE SKU &amp; EAN</th>
                <th class="th">NAMA BARANG &amp; BRAND</th>
                <th class="th">KATEGORI</th>
                <th class="th">LOKASI RAK / BIN</th>
                <th class="th">STOK FISIK (ROP)</th>
                <th class="th">NILAI ASET / UNIT</th>
                <th class="th">STATUS</th>
                <th class="th">AKSI</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="td">
                  <b class="sku">SKU-CAM-600D</b><br />899273618290
                </td>
                <td class="td">
                  Canon 60D DSLR Camera Body<br /><span class="text-slate-500"
                    >Brand: Canon Inc.</span
                  >
                </td>
                <td class="td">
                  <span class="badge b-slate">Kamera &amp; Optik</span>
                </td>
                <td class="td">WH01-RA-02</td>
                <td class="td">
                  4 Unit (ROP 25)
                  <div class="bar red"><i style="width: 16%"></i></div>
                </td>
                <td class="td">Rp 8.500.000</td>
                <td class="td"><span class="badge b-red">Menipis</span></td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">SKU-CAM-NIK8</b><br />899273618412
                </td>
                <td class="td">
                  Nikon Reel Optical Pro X<br /><span class="text-slate-500"
                    >Brand: Nikon Corp.</span
                  >
                </td>
                <td class="td">
                  <span class="badge b-slate">Kamera &amp; Optik</span>
                </td>
                <td class="td">WH01-RA-03</td>
                <td class="td">
                  7 Unit (ROP 20)
                  <div class="bar red"><i style="width: 35%"></i></div>
                </td>
                <td class="td">Rp 12.450.000</td>
                <td class="td"><span class="badge b-red">Menipis</span></td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">SKU-WTC-AP40</b><br />899120491023
                </td>
                <td class="td">
                  Titan Smart Watch Classic Silver<br /><span
                    class="text-slate-500"
                    >Brand: Titan Gear</span
                  >
                </td>
                <td class="td">
                  <span class="badge b-slate">Wearable Gadget</span>
                </td>
                <td class="td">WH01-RA-02-T3</td>
                <td class="td">
                  180 Pcs (ROP 40)
                  <div class="bar green"><i style="width: 90%"></i></div>
                </td>
                <td class="td">Rp 1.850.000</td>
                <td class="td"><span class="badge b-green">Stok Aman</span></td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">SKU-LAP-M102</b><br />899553102450
                </td>
                <td class="td">
                  Macbook Pro M1 2020 Space Gray<br /><span
                    class="text-slate-500"
                    >Brand: Apple</span
                  >
                </td>
                <td class="td">
                  <span class="badge b-slate">Laptop &amp; Komputer</span>
                </td>
                <td class="td">WH01-RA-01</td>
                <td class="td">
                  100 Unit (ROP 15)
                  <div class="bar green"><i style="width: 75%"></i></div>
                </td>
                <td class="td">Rp 16.200.000</td>
                <td class="td"><span class="badge b-green">Stok Aman</span></td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
              <tr>
                <td class="td">
                  <b class="sku">SKU-STR-SD01</b><br />899881920381
                </td>
                <td class="td">
                  Sandisk Extreme Portable SSD 1TB<br /><span
                    class="text-slate-500"
                    >Brand: SanDisk</span
                  >
                </td>
                <td class="td">
                  <span class="badge b-slate">Storage Drive</span>
                </td>
                <td class="td">WH01-RA-01-T2</td>
                <td class="td">
                  0 Unit (ROP 30)
                  <div class="bar"><i style="width: 0%"></i></div>
                </td>
                <td class="td">Rp 2.100.000</td>
                <td class="td"><span class="badge b-blue">Habis</span></td>
                <td class="td">
                  <span class="text-blue-700 font-semibold">Detail</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="p-3 text-xs text-slate-500 border-t border-slate-100">
          Menampilkan 1 - 5 dari 8.650 total barang
        </p>
      </section>
    </template>
    <script>
      // Memuat layout bersama (butuh server lokal, mis. Live Server)
      fetch("../layouts/MainLayout.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("app").innerHTML = h;
          document
            .getElementById("content")
            .append(document.getElementById("page").content);
          document
            .querySelector('[data-nav="' + document.body.dataset.active + '"]')
            ?.classList.add("nav-active");
        });
    </script>
  </body>
</html>
